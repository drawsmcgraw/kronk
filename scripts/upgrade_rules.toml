# Upgrade rules (sprint M18): what the monthly run may move by itself, what
# waits for the quarterly report and Drew's greenlight, and what is never
# touched. Read by scripts/upgrades.py; this file is the only place the
# rules live. Mapping confirmed by Drew 2026-11-14 / 2026-11-15 (plan,
# "M18. An upgrade cadence"); docs/features/upgrade-cadence.md explains it.
#
# A [[component]] is one pin. Fields:
#   name      id used in logs, commits, tags and notices
#   kind      image | base-image | tool | lockfile | host-venv | llama-build | blueprint
#   file      repo-relative file the pin is written in
#   match     regex; group 1 is the pin. Exactly one line of `file` must match
#   pattern   regex an exact version must match in full. Its groups are
#             compared as integers, left to right (the first `compare`
#             groups; default all). A pin or a candidate that does not match
#             is not a version this rule understands: a pin is skipped and
#             reported, a candidate is ignored. Only ASCII digits count, and
#             a compared group with a leading zero does not match unless
#             `zero_padded = true` (a date such as 20250404).
#   same      how many leading groups a monthly (minor) upgrade keeps equal.
#             2 = patch releases within X.Y. 0 = any newer release.
#   minor     auto     the monthly run applies the newest release `same` allows
#             report   listed by the monthly log and the quarterly report, never applied
#             none     nothing is minor for this component (quarterly report only)
#             excluded never looked at beyond the inventory (with `why`)
#   releases  where versions, dates and notes come from:
#             github:<owner>/<repo> (release list; `tag_prefix` is stripped),
#             dockerhub:<namespace>/<repo> (tags; `last_updated` is the date),
#             pypi:<package>
#   registry  where the image tag must exist before it is used:
#             dockerhub:<namespace>/<repo> or ghcr:<owner>/<repo>
#   image     the image name in the pin line (image components)
#   deploy    kronk | ha | compose (how a new pin is brought up; see upgrades.py)
#   container the running container, for the inventory and the image check
#   health    checks that must pass after the new version is up
#   order     the monthly run's order, lowest first (see [settings])
#
# Never in this file: models (GGUF), the llama.cpp builds as anything but
# "none", Music Assistant as anything but "excluded".

[settings]
# The branch an unattended commit may land on. Production is deployed from
# tags made on this branch; a run on any other branch declines, and a
# recovery acts only on it. The one override is KRONK_UPGRADE_BRANCH in
# ~/.config/kronk/upgrade.env (written at install; the units' drop-in reads
# it as an EnvironmentFile, a run by hand reads it too) or in the
# environment. During the sprint production's tags are made on `refactor`;
# the coordinator writes that file at install.
expected_branch = "main"
# A release younger than this is not taken yet (the telemetry pins'
# two-week rule, docker-compose.telemetry.yml). A release whose date cannot
# be read is skipped, not assumed old.
min_age_days = 14
# A release is taken only when the project's release list (GitHub) and the
# registry both have it and both dates are at least min_age_days old. A
# registry tag pushed more than this many hours after its release is a
# moved (re-pushed) tag: not taken, and reported in the plan. ghcr gives no
# push date; the image's build time (its config's `created`) stands in.
# Where the registry is the release list (SearXNG, nginx, the Python bases
# on Docker Hub), there is one date and no moved-tag check.
moved_tag_grace_hours = 48
# Quiet window: no spoken or typed request, no satellite state change.
quiet_minutes = 5
# HA's selects (wake word / assistant slots) must be this old (M12 H6).
select_quiet_minutes = 15
# The timer fires on days 1-7 of the month; a run that declines tries again
# the next day, at most this many attempts per month. A component not
# started (the house got busy, the window closed, a precondition) is tried
# again the next night; the month is done when every planned component has
# another outcome, or the attempts run out (the last notice lists the rest).
max_attempts = 7
# The monthly run works only inside this local-time window (start, end;
# may cross midnight). Started outside it (the timer's boot catch-up,
# Persistent=true) it declines without counting an attempt, and the next
# night's firing runs. Between components it checks again: a run still
# going at the end of the window leaves the rest for the next night. By
# hand: scripts/upgrade_minor.sh --ignore-window.
night_window = ["02:00", "05:00"]
# The quarterly check waits this long for the upgrade lock (a monthly run,
# or a run by hand, holds it) before it gives up and says so. Kept under
# its unit's TimeoutStartSec (30m) so the give-up and its notice happen
# before systemd kills it. The monthly timer's days (1-7) never overlap
# the quarterly's (the 8th), but the hourly notices command takes the same
# lock briefly, both timers are Persistent=true (a boot can fire them
# together), and a run by hand can hold it.
major_lock_wait_minutes = 20
# Files whose changes do not reach the Kronk stack's containers. The run
# tags HEAD and deploys it, so HEAD may differ from the tag production runs
# only in these (fnmatch patterns; * crosses directories). Anything else is
# work that has not been deployed, and an unattended deploy would ship it:
# the run declines the Kronk-stack components and names the files.
inert_paths = [
  "docs/*", "README.md", "ROADMAP.md", "TECH_DEBT.md", "CLAUDE.md",
  "Kronk evaluation findings and implementation plan.md",
  "docker-compose.ha.yml", "docker-compose.ma.yml", "docker-compose.telemetry.yml",
  "ha/*", "ma/*", "systemd/*", "scripts/*", "telemetry/*", "hottub_monitor/*",
  # tests/: the images copy only voice_corpus.jsonl and fixtures/music_snapshot.json
  # (the `corpus` build context), so the Python test files are inert.
  "tests/*.py",
]
# Dev containers in the kronk project: not production, not checked.
dev_services = ["orchestrator-dev", "tool_service-dev"]
# "House busy" means the household. Not counted: requests under /dev/ in
# nginx's log (the dev path), requests carrying the run's own User-Agent
# (deploy_tag.sh's /api/chat check), and runs voice_tracer holds that are on
# these HA pipelines or from the run's own replays. voice_tracer's state file
# lists the held run ids (read-only).
dev_pipelines = ["kronk-dev"]
voice_tracer_state = "data/voice_tracer_state.json"
# Media players that change state on their own while HA restarts (sprint
# M18 e2e reports, 2026-11-18): the television went off -> unavailable
# twice during one replay; both Sonos Moves went unavailable / off between
# 14:06 and 14:10 with nobody near them. HA's "players as before" check
# (M12 H8) skips these. For every other player, a move between idle, off,
# paused, standby and on is not a difference; anything else is, and a
# player that was available and is `unavailable` after the wait fails the
# upgrade. A rollback's check never fails on a player: it reports it.
flapping_players = [
  "media_player.xbr_49x800d",
  "media_player.sonos_move_derp",
  "media_player.sonos_move_derp_2",
  # A laptop's and two browsers' players: all three `unavailable` on
  # 2026-11-18 (third M18 e2e report, docs/sprint/M18-e2e3.md); one coming
  # online during HA's restart would fail the upgrade for nothing HA did.
  "media_player.camerons_macbook_pro",
  "media_player.drew_s_windows_firefox",
  "media_player.web_firefox_on_linux",
]

[replay]
# Rows of tests/voice_corpus.jsonl known to flap on the live dev replay
# (sprint briefs, 2026-11-17). A flapping row does not fail an upgrade.
# Rows carrying xfail.live already count as expected failures in the replay.
flappers = [
  "inc-0930-search-deep-house-ytm",
  "eval-look-for-some-good-deep-house-chill",
  "eval-search-youtube-music-for-some-deep-chill",
  "eval-shuffle-it",
  "eval-start-a-zzqx-florbent-radio-station-on",
  "m14-resume-get-the-door",
  # Depends on a 4B model choosing the tool: failed once in 22 replays (M18 fourth test, Z8).
  "m19-can-you-ask-kronk-to-turn-it-up",
]

[report]
# The quarterly report (scripts/upgrade_major_check.sh). Home Assistant's
# release notes are scanned for these integration points (lower-case
# substrings); other components for generic_keywords. `affects` names the
# Kronk systems behind each point. A keyword hit is a lead for the reader,
# not a verdict.
first = ["homeassistant"]     # plan M18 step 5: the first major upgrade is HA
max_lines_per_point = 25
generic_keywords = ["breaking", "deprecat", "removed", "no longer", "security", "cve-"]

[report.integration_points]
"Ollama conversation integration" = ["ollama"]
"Assist pipelines and satellites" = ["assist_pipeline", "assist pipeline", "assist_satellite", "assist satellite", "voice pe", "satellite", "wake word", "debug_recording", "debug_recording_dir"]
"ESPHome (the pucks' integration)" = ["esphome"]
"Wyoming" = ["wyoming"]
"Conversation and sentence triggers" = ["conversation", "sentence trigger", "trigger: conversation", "intent_script", "default agent", "prefer_local_intents", "local intents"]
"Music Assistant integration" = ["music_assistant", "music assistant"]
"Matter" = ["matter"]
"Text-to-speech and speech-to-text" = ["tts", "stt", "text-to-speech", "speech-to-text", "piper", "whisper"]

[report.affects]
"Ollama conversation integration" = "the conversation entities behind the kronk and kronk-dev pipelines, which call /api/chat and /dev/voice"
"ESPHome (the pucks' integration)" = "how HA talks to the two Voice PEs and the Satellite1 (firmware stays as it is: no firmware changes)"
"Assist pipelines and satellites" = "the three satellites (two Voice PEs, a Satellite1), the two pipelines, voice_tracer's pipeline websocket, M12's debug_recording_dir"
"Wyoming" = "the Whisper entries (10300, dev 10301) and the Piper entry (10200)"
"Conversation and sentence triggers" = "the Music Assistant voice blueprint (mass_assist_kronk), prefer_local_intents, voice_replay's sentence-match debug"
"Music Assistant integration" = "music playback through HA's MA integration (the blueprint fast path)"
"Matter" = "M15 device control (not built; no Matter integration loaded)"
"Text-to-speech and speech-to-text" = "streamed TTS (M8), Whisper STT"

# ── Telemetry stack (project kronk-telemetry) ────────────────────────────

[[component]]
# Grafana Tempo, the trace store. Semver; Drew: patch releases are minor,
# minor and major releases are major.
name = "tempo"
kind = "image"
order = 10
file = "docker-compose.telemetry.yml"
match = '^\s*image:\s*grafana/tempo:(\S+)'
image = "grafana/tempo"
pattern = '^(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "auto"
releases = "github:grafana/tempo"
tag_prefix = "v"
registry = "dockerhub:grafana/tempo"
deploy = "compose"
project = "kronk-telemetry"
service = "tempo"
env_file = ".env.telemetry"
container = "kronk-telemetry-tempo-1"
health = [{ type = "http", url = "http://localhost:3200/ready" }]

[[component]]
# Grafana. Semver; patch releases are minor (13.2.4 -> 13.2.x), 13.3 is major.
name = "grafana"
kind = "image"
order = 20
file = "docker-compose.telemetry.yml"
match = '^\s*image:\s*grafana/grafana:(\S+)'
image = "grafana/grafana"
pattern = '^(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "auto"
releases = "github:grafana/grafana"
tag_prefix = "v"
registry = "dockerhub:grafana/grafana"
deploy = "compose"
project = "kronk-telemetry"
service = "grafana"
env_file = ".env.telemetry"
container = "kronk-telemetry-grafana-1"
health = [{ type = "http", url = "http://localhost:3000/api/health" }]
# Bind-mounted paths Grafana reloads by itself while it runs (the dashboard
# provider polls every 30 s: telemetry/grafana/provisioning/dashboards/kronk.yaml),
# so a change there after the start is already loaded and does not hold the
# upgrade back. Provisioning (datasources) loads at start only and counts.
live_binds = ["telemetry/grafana/dashboards"]

# ── Kronk stack (project kronk; deployed from a tag by deploy_tag.sh) ─────

[[component]]
# Piper TTS behind Wyoming. Semver; patch releases are minor.
name = "wyoming-piper"
kind = "image"
order = 30
file = "docker-compose.yml"
match = '^\s*image:\s*rhasspy/wyoming-piper:(\S+)'
image = "rhasspy/wyoming-piper"
pattern = '^(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "auto"
releases = "github:rhasspy/wyoming-piper"
tag_prefix = "v"
registry = "dockerhub:rhasspy/wyoming-piper"
deploy = "kronk"
container = "wyoming-piper"
health = [{ type = "wyoming", host = "127.0.0.1", port = 10200 }]

[[component]]
# SearXNG publishes rolling date builds (YYYY.M.D-<commit>) and no
# major/minor/patch. The table's "patch releases are minor" is read as:
# any newer build at least min_age_days old is the monthly move, which is
# what docs/runbooks/searxng-bump.md already does by hand ~monthly (the
# weekly canary nags past 35 days). The commit suffix is not compared.
# An interpretation of Drew's table: set minor = "none" to make every
# SearXNG move a quarterly, greenlit one.
name = "searxng"
kind = "image"
order = 40
file = "docker-compose.yml"
match = '^\s*image:\s*searxng/searxng:(\S+)'
image = "searxng/searxng"
pattern = '^(\d{4})\.(\d{1,2})\.(\d{1,2})-([0-9a-f]{7,})$'
compare = 3
same = 0
minor = "auto"
releases = "dockerhub:searxng/searxng"
registry = "dockerhub:searxng/searxng"
deploy = "kronk"
container = "kronk-searxng-1"
health = [
  { type = "docker-healthy", container = "kronk-searxng-1" },
  # One search through the network path tool_service uses; at least one result.
  { type = "exec", container = "kronk-tool_service-1", cmd = ["python", "-c", "import httpx,sys; r=httpx.get('http://searxng:8080/search', params={'q':'weather forecast','format':'json'}, timeout=20); sys.exit(0 if r.status_code==200 and r.json().get('results') else 1)"] },
]

[[component]]
# nginx. The pin `1.29-alpine` is a floating tag (it moves with every
# 1.29.x), not an exact version, so the run skips it and says so. To bring
# it under the cadence, pin an exact `1.29.N-alpine`; patch releases are
# then minor, a new 1.N line is major.
name = "nginx"
kind = "image"
order = 50
file = "docker-compose.yml"
match = '^\s*image:\s*nginx:(\S+)'
image = "nginx"
pattern = '^(\d+)\.(\d+)\.(\d+)-alpine$'
same = 2
minor = "auto"
releases = "dockerhub:library/nginx"
registry = "dockerhub:library/nginx"
deploy = "kronk"
container = "kronk-nginx-1"
running = { cmd = ["docker", "exec", "kronk-nginx-1", "nginx", "-v"], regex = 'nginx/(\S+)' }
health = [{ type = "http", url = "http://localhost/api/status" }]

[[component]]
# LiteLLM, every LLM call transits it. Tags are v-prefixed semver; the
# -stable / -nightly / -rc / -dev tags are not exact releases and are ignored.
# Patch releases are minor (v1.88.1 -> v1.88.x); a new v1.N is major.
name = "litellm"
kind = "image"
order = 60
file = "docker-compose.yml"
match = '^\s*image:\s*ghcr\.io/berriai/litellm:(\S+)'
image = "ghcr.io/berriai/litellm"
pattern = '^v(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "auto"
releases = "github:BerriAI/litellm"
registry = "ghcr:berriai/litellm"
# The quarterly report: Kronk uses the proxy, one config file, a callback
# hook (litellm/hooks.py) and the health routes; the price-table bots are noise.
report_keywords = ["breaking", "needs action", "removed", "security", "cve-", "callback", "custom_logger", "health", "cosign", "config.yaml", "proxy_config"]
report_skip = '^chore\(prices\)|sync .* prices|^test|^ci\('
deploy = "kronk"
container = "kronk-litellm-1"
health = [
  { type = "docker-healthy", container = "kronk-litellm-1" },
  { type = "http", url = "http://localhost:8002/health/liveliness" },
]

# ── Home Assistant (project kronk-ha; recreated from the working tree) ───

[[component]]
# Home Assistant. Calendar versions YYYY.M.P. Drew 2026-11-15: patch
# releases within the pinned month are minor (2026.5.4 -> 2026.5.5); a new
# monthly release (2026.6) is major, it carries breaking changes. The
# monthly patch run is the one approved cause of an unannounced HA restart
# (CLAUDE.md), and it still picks its moment. Last in the order: every
# other component's live replay goes through HA.
name = "homeassistant"
kind = "image"
order = 90
file = "docker-compose.ha.yml"
match = '^\s*image:\s*ghcr\.io/home-assistant/home-assistant:(\S+)'
image = "ghcr.io/home-assistant/home-assistant"
pattern = '^(\d{4})\.(\d{1,2})\.(\d+)$'
same = 2
minor = "auto"
releases = "github:home-assistant/core"
registry = "ghcr:home-assistant/home-assistant"
deploy = "ha"
project = "kronk-ha"
service = "homeassistant"
container = "homeassistant"
health = [{ type = "ha-api" }]

# ── Build inputs of the Kronk images ─────────────────────────────────────

[[component]]
# Base image of the orchestrator. `3.12-slim` floats with every 3.12.x and
# Debian point release: not an exact version, skipped and reported. A
# rebuild takes whatever python:3.12-slim is cached locally (no --pull).
name = "python-base-orchestrator"
kind = "base-image"
order = 70
file = "orchestrator/Dockerfile"
match = '^FROM\s+python:(\S+)'
image = "python"
pattern = '^(\d+)\.(\d+)\.(\d+)-slim$'
same = 2
minor = "auto"
releases = "dockerhub:library/python"
registry = "dockerhub:library/python"
deploy = "kronk"
running = { cmd = ["docker", "exec", "kronk-orchestrator-1", "python", "-c", "import platform; print(platform.python_version())"], regex = '(\S+)' }

[[component]]
# Base image of tool_service; as python-base-orchestrator.
name = "python-base-tool_service"
kind = "base-image"
order = 71
file = "tool_service/Dockerfile"
match = '^FROM\s+python:(\S+)'
image = "python"
pattern = '^(\d+)\.(\d+)\.(\d+)-slim$'
same = 2
minor = "auto"
releases = "dockerhub:library/python"
registry = "dockerhub:library/python"
deploy = "kronk"
running = { cmd = ["docker", "exec", "kronk-tool_service-1", "python", "-c", "import platform; print(platform.python_version())"], regex = '(\S+)' }

[[component]]
# Base image of voice_tracer; as python-base-orchestrator.
name = "python-base-voice_tracer"
kind = "base-image"
order = 72
file = "voice_tracer/Dockerfile"
match = '^FROM\s+python:(\S+)'
image = "python"
pattern = '^(\d+)\.(\d+)\.(\d+)-slim$'
same = 2
minor = "auto"
releases = "dockerhub:library/python"
registry = "dockerhub:library/python"
deploy = "kronk"
running = { cmd = ["docker", "exec", "kronk-voice_tracer-1", "python", "-c", "import platform; print(platform.python_version())"], regex = '(\S+)' }

[[component]]
# uv, the installer in all three Dockerfiles (`pip install uv`): unpinned,
# so each image has whichever uv was newest at its last uncached build.
# Reported, never applied: it is a build tool, and pinning it is a code change.
name = "uv"
kind = "tool"
order = 80
file = "orchestrator/Dockerfile"
match = '^RUN\s+pip install\s+(uv\S*)'
pattern = '^uv==(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "report"
releases = "pypi:uv"
running = { cmd = ["docker", "exec", "kronk-orchestrator-1", "uv", "--version"], regex = 'uv (\S+)' }

[[component]]
# Debian's git in the orchestrator image (M21 step 2), held to the 2.47
# series by design: a security update within it is taken at the next
# uncached build, a new series only by editing the line.
name = "git-orchestrator"
kind = "tool"
order = 81
file = "orchestrator/Dockerfile"
match = "'git=([^']+)'"
pattern = '^1:(\d+)\.(\d+)\.\*$'
same = 2
minor = "none"
why = "a Debian package series pin; no registry to read"
running = { cmd = ["docker", "exec", "kronk-orchestrator-1", "git", "--version"], regex = 'git version (\S+)' }

# ── Python lockfiles (hash-pinned, uv pip compile --generate-hashes) ─────
# Report only. The monthly run lists the patch releases available; it does
# not regenerate the locks. Why (docs/sprint/M18-build.md): the offline
# corpus runs in tests/.venv, which is not built from these locks, so it
# would not test the new versions; regenerating resolves against PyPI and
# takes whatever was uploaded, with fresh hashes, and nobody reads the diff;
# voice_tracer has no dev twin to try a new lock on. The quarterly report
# carries the list; applying it is a runbook step.

[[component]]
# orchestrator/requirements.lock: the orchestrator image (and orchestrator-dev). Patch releases listed, report only.
name = "lock-orchestrator"
kind = "lockfile"
order = 100
file = "orchestrator/requirements.lock"
pattern = '^(\d+)\.(\d+)(?:\.(\d+))?$'
same = 2
minor = "report"
releases = "pypi"
container = "kronk-orchestrator-1"

[[component]]
# tool_service/requirements.lock: the tool_service image (and tool_service-dev). Patch releases listed, report only.
name = "lock-tool_service"
kind = "lockfile"
order = 101
file = "tool_service/requirements.lock"
pattern = '^(\d+)\.(\d+)(?:\.(\d+))?$'
same = 2
minor = "report"
releases = "pypi"
container = "kronk-tool_service-1"

[[component]]
# voice_tracer/requirements.lock: the voice_tracer image (no dev twin). Patch releases listed, report only.
name = "lock-voice_tracer"
kind = "lockfile"
order = 102
file = "voice_tracer/requirements.lock"
pattern = '^(\d+)\.(\d+)(?:\.(\d+))?$'
same = 2
minor = "report"
releases = "pypi"
container = "kronk-voice_tracer-1"

# ── Host-side builds: never automatic ────────────────────────────────────

[[component]]
# llama.cpp servers. Builds have no stable scheme (b<build number>); any new
# build is a quarterly item with the model benches re-run. The pin is the
# build directory in each unit's ExecStart. Directories without a build
# number (llama-gfx1151-rocm7 and the like) are hand builds: reported as such.
name = "llama.cpp"
kind = "llama-build"
order = 200
file = "systemd/llama-gemma4-e4b.service"
units = ["llama-gemma4-e4b", "llama-devstral-q4", "llama-talkie"]
match = 'llama-cpp/llama-b(\d+)-'
pattern = '^b?(\d+)$'
same = 1
minor = "none"
why = "llama.cpp builds have no stable scheme; any new build waits for the quarterly report and the model benches"
releases = "github:ggml-org/llama.cpp"
# Every llama.cpp build is flagged pre-release on GitHub; the flag carries no meaning here.
ignore_prerelease_flag = true

[[component]]
# wyoming-faster-whisper in the host venv ~/services/wyoming-whisper/.venv
# (production and dev units share it). Not in Drew's table; the venv carries
# a ROCm ctranslate2 build, so any change is a rebuild: report only.
name = "wyoming-faster-whisper"
kind = "host-venv"
order = 210
venv = "~/services/wyoming-whisper/.venv"
package = "wyoming_faster_whisper"
pattern = '^(\d+)\.(\d+)\.(\d+)$'
same = 2
minor = "none"
why = "not in the minor/major table; a GPU (ROCm) build in a host venv, not a pin in the repo"
releases = "pypi:wyoming-faster-whisper"

[[component]]
# The Music Assistant voice blueprint, forked from upstream version 20250404
# (ha/blueprints/mass_assist_kronk.yaml). Report only: the fork carries
# Kronk's changes and is merged by hand.
name = "ma-blueprint"
kind = "blueprint"
order = 220
file = "ha/blueprints/upstream/mass_assist_blueprint_en.yaml"
match = '^\s*version:\s*(\d{8})\s*$'
pattern = '^(\d{4})(\d{2})(\d{2})$'
# A date: its month and day carry a leading zero. Everywhere else a part
# with a leading zero (13.02.6) is not a version (sprint M18 fix 2, O1).
zero_padded = true
same = 0
minor = "none"
