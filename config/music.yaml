# Music playback tuning, read by tool_service (sprint M21 step 1;
# docs/features/config-directory.md).
#
# Read by tool_service/config_loader.py at startup and on POST /config/reload
# (scripts/config_reload.sh). Schema: the Music model in that module. An
# unknown key, a wrong type ("8" is not 8) or an out-of-range number rejects
# the whole file, with its line, on /services; the values in effect stay as
# they were. A key left out takes its built-in default, which is the value
# written here.

# Checking that a command took effect (tenet 6: verify the effect, not the
# status code).
verify:
  # Seconds tool_service polls a player for the state a command should
  # produce (`playing` after play, paused after pause, a new track after a
  # skip) before it reports failure. The spoken failure names this number.
  # Keep it below the orchestrator's tool_timeouts for the music tools
  # (tuning.yaml). More than 0, at most 60.
  timeout_s: 8

# Matching a named request ("Destiny Waving by Ulrich Schnauss") against
# Music Assistant's search results: music_resolve.score() gives every
# candidate a score, roughly 0 to 1, and the best one plays if it clears
# play_min_score. Tuned on the logged misses in tests/test_music_resolve.py:
# run that file after any change here. Scores and thresholds 0 to 1;
# bonuses 0 to 0.2.
resolver:
  # Below this a match is a guess, not a resolution: nothing plays and the
  # answer says what was not found. Every real target scores at least 0.82;
  # gibberish stays under 0.4.
  play_min_score: 0.75
  # With no artist named, a near match must cover every word of the
  # request this well (worst word's best match), or it is held under
  # play_min_score. 0.80, not 0.85: one misheard vowel in a six-letter word
  # is 0.83 ("Hotel Costas", 2026-11-08).
  coverage_min: 0.80
  # Added when the request named the candidate's provider ("on YouTube Music").
  provider_bonus: 0.05
  # Added when the candidate is in the household's library, so a near-tie
  # goes to our own copy.
  library_bonus: 0.03
  # Added by media type, to break near-ties: the artist over a same-named
  # album, a whole album over its title track.
  type_bonus:
    # An artist (plays the artist's radio or top tracks).
    artist: 0.02
    # An album.
    album: 0.015
    # A playlist.
    playlist: 0.01
    # A single track.
    track: 0.0
    # A radio station.
    radio: 0.0
  # A miss names "the closest I found" only when that candidate scores at
  # least this; below it the guess is noise.
  hint_min_score: 0.5

# Reading a spoken sentence (sprint M11: POST /music/say and its shadow,
# music_resolve.parse_sentence; docs/features/voice-music-control.md). Not
# used by the live /music path. Words are lowercase and single-spaced.
parser:
  # Words that mark a style rather than a named item: "some" or "something"
  # as the request's first word, the others as its last ("play some jazz",
  # "play italian music"). A type word below wins over these.
  style_markers: [some, something, music, songs, vibes]
  # A type word decides outright that the request names an item of that
  # type: "play the album Jazz" is the album, not the style. Word: media
  # type (artist, album, track, playlist or radio).
  type_words: {album: album, albums: album, track: track, song: track, artist: artist, band: artist, playlist: playlist, radio: radio, station: radio}
  # Words in front of a style, or before "songs by", that are not part of
  # it: "some good deep house" is deep house, "top songs by X" is X.
  fillers: [a bit of, a little bit of, a little, any, more, good, nice, great, top, best, greatest, me, us]
  # A room or speaker named at the end of the sentence ("on the sonos move
  # dirt") that matches no real name exactly still matches one this similar
  # (0 to 1). Only the right-hand end of the sentence is read for a room.
  room_min_score: 0.85

# The decision order (sprint M11: POST /music/say and its shadow,
# music_decide.py; docs/features/voice-music-control.md). Not used by the
# live /music path.
decision:
  # The steps, in order. markers: a type word or a style word decides the
  # reading. genre_list: an unmarked request that is a known genre is a
  # style. named: search and score as a named item. cross_type: a typed
  # request with no strong match looks for the name as another type.
  # other_reading: an unknown style is retried as a name, a name with no
  # strong match as a style if the genre list knows it. model: one question
  # to the model, style or named, when the steps before it left it unclear.
  # The first five keep this order; model may move anywhere among them
  # (Drew, 2026-11-11: earlier as the model gets faster).
  order: [markers, genre_list, named, cross_type, other_reading, model]
  # A candidate at least this good is a strong match: it plays. Below it,
  # the next step runs. 0 to 1.
  strong_min_score: 0.75
  # Among strong candidates of the same type, the first provider listed
  # wins; the score breaks ties. A provider named in the sentence goes
  # first. filesystem_local is the NAS library, ytmusic YouTube Music.
  provider_order:
    # An artist: the NAS first, then YouTube Music (Drew, 2026-11-14).
    artist: [filesystem_local, ytmusic]
    # An album: the NAS first, then YouTube Music (Drew, 2026-11-11).
    album: [filesystem_local, ytmusic]
    # A song: the NAS first, then YouTube Music.
    track: [filesystem_local, ytmusic]
    # A playlist: the NAS first, then YouTube Music.
    playlist: [filesystem_local, ytmusic]
    # A station: Pandora.
    radio: [pandora]
  # The model question. Its answer only picks the branch; the words still
  # come from the sentence.
  model:
    # false skips the question; the rules' own reading stands.
    enabled: true
    # The LiteLLM model name.
    model: gemma-4-e4b
    # Reasoning before the answer. Off: 0.3 s against 1.5 to 2.5 s, the
    # same answer on 20 of 20 test requests (2026-11-17).
    thinking: false
    # Seconds before the question is given up and the rules' reading
    # stands. More than 0, at most 30.
    timeout_s: 4
