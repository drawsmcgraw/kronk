# Kronk fork of the Music Assistant local-voice blueprint.
#
# Upstream: https://github.com/music-assistant/voice-support
#           local-assist-blueprint/mass_assist_blueprint_en.yaml, version 20250404
#           (pristine copy: ha/blueprints/upstream/mass_assist_blueprint_en.yaml)
# Forked:   2026-09-04 — docs/plans/VOICE_MUSIC_DEVICE_FIRST_PLAN.md
# Installed to HA as blueprints/automation/kronk/mass_assist_kronk.yaml
# (docker cp; upstream's file is left untouched).
#
# Three changes, everything else verbatim:
#   1. device rung — the MA player on the same physical device that heard
#      the request (MAC join: ESPHome device `connections` → MA identifier
#      'up' + MAC), placed ahead of the area rung
#   2. group preference — a room with a Music Assistant sync group targets
#      the group only, not every player in the room
#   3. the spoken confirmation names the room when the match was by device
#      or room, so technical device names are never read aloud
#   4. (2026-09-14) a second radio sentence for station-FIRST phrasing —
#      "play anime pop radio on pandora" — which upstream's grammar misses;
#      without it HA's built-in search-and-play intent takes the request
#      and lands on YouTube Music title matches (MUSIC_ACCURACY_PLAN)
#   9. (2026-10-21) hand to Kronk what this tier can't do well: loose
#      phrasings ("play some deep house", "play something chill", "play
#      some music") and a failed play of a named album/track/artist/
#      playlist (a misspelling — MUSIC_TASTE_AGENT_PLAN step 7)
#  10. (2026-10-21) shuffle is set before play_media, not after: MA
#      shuffles only the tracks after the current one, so a shuffled
#      playlist always opened on its track 1
#
# Resolution: named player → named room (group-preferred) → own device →
# own device's room (group-preferred) → default.
#
# MAINTENANCE: upstream updates do not flow into this file. Diff the new
# upstream against ha/blueprints/upstream/ and re-apply the three changes.
blueprint:
  domain: automation
  name: Kronk - Music Assistant voice (device-first)
  description: ' ![Image](https://github.com/music-assistant/voice-support/blob/main/assets/music-assistant.png?raw=true)

    # Play media using voice commands — Kronk fork (device-first)

    An unnamed request plays on the satellite that heard it; a named room plays
    on that room''s Music Assistant sync group when one exists, else on every
    player in the room. Everything else is the upstream Music Assistant blueprint
    (version 20250404).

    ### Blueprint setup

    #### Required

    * Set a `Default Player` to be used when no target is mentioned in the request
    and the requesting device has neither its own Music Assistant player nor an
    area with one.

    #### Optional

    * Change the trigger sentence or add more, you can also use this to translate
    the sentence to your own language.

    * Change the responses or translate them to your own language.


    ### Usage

    All sentences must:

    * start with the words `Shuffle`, `Play` or `Listen to` followed by the item type
    `artist`/`track`/`album`/`playlist`/`radio` and then the name of the item. If
    the sentence starts with `Shuffle`, the player that plays the request will also
    have the shuffle option turned on, otherwise it will be turned off.

    * for album and track be optionally followed by `by [the] artist` and then the
    artist name

    * then be optionally followed by an area name or device name

    * then, for artist, track, album or playlist, be optionally followed by the phrase
    `using radio mode`

    #### Accepted variations

    usage of the article `the` is optional

    |Media type|Accepted variations|

    |---|---|

    |`artist`|`band`, `group`|

    |`track`|`song`|

    |`radio`|`radio station`, `radio`|

    |`playlist`||


    #### Examples

    ```

    Play the artist Pink Floyd in the kitchen

    Listen to album Jagged Little Pill in the study

    Listen to the album Greatest Hits by the artist James Taylor in the kitchen

    Play track New Years Day in the bedroom

    Play track New Years Day in the bedroom using radio mode

    Play the song A Hard Days Night by Billy Joel in the bedroom

    Listen to the playlist Classic Rock in the study

    Listen to the radio station BBC Radio 1 in the bedroom

    Play the album Classical Nights on the Bedroom Sonos Speaker

    Listen to the record Classical Nights on the Bedroom Sonos Speaker

    Play the band U2

    Shuffle songs by Muse.

    Shuffle the album Classical Nights on the Bedroom Sonos Speaker

    Play the audiobook Roadside Picnic

    ```'
  input:
    default_player_entity_id_input:
      name: Default Media Player
      selector:
        entity:
          filter:
          - integration: music_assistant
            domain:
            - media_player
          multiple: false
          reorder: false
    trigger_response_settings:
      name: Trigger and response settings for Assist
      icon: mdi:chat
      description: 'You can change the existing triggers or add more triggers in these
        settings. Put text between square brackets [ ] to make it optional. With round
        brackets ( ) and a pipe character | you can enter multiple values which are
        treated as ''or''. { query } is a wildcard value which will contain the requested
        media and optionally the area or Music Assistant player.

        You can also set the responses Assist will give. It uses jinja templates which
        will be replaced with the media information and player name of the Music Assistant
        player.'
      collapsed: true
      input:
        album_trigger:
          name: Album trigger
          description: The trigger sentences to request a specific album.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (shuffle|play|listen to) [the ](album|ep|record|compilation|single) {media_name}
            [by [the ](artist|band|group) {artist}] [(in|on|using) [the ]{area_or_player_name}][
            (with|using) {radio_mode}]
        track_trigger:
          name: Track trigger
          description: The trigger sentences to request a specific track.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (shuffle|play|listen to) [the ](track|song) {media_name} [by [the ](artist|band|group)
            {artist}] [(in|on|using) [the ]{area_or_player_name}][ (with|using) {radio_mode}]
        artist_trigger:
          name: Artist trigger
          description: The trigger sentences to request music from a specific artist.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (shuffle|play|listen to) [the ](artist|band|group) {media_name} [(in|on|using)
            [the ]{area_or_player_name}][ (with|using) {radio_mode}]
        audiobook_trigger:
          name: Audiobook trigger
          description: The trigger sentences to request an audiobook.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (play|listen to) [the ](book|audio book|audiobook) {media_name} [(in|on|using)
            [the ]{area_or_player_name}]
        radio_trigger:
          name: Radio trigger
          description: The trigger sentences to request a specific radio station.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (shuffle|play|listen to) [the ]((radio station)|(radio)|(station)) {media_name}
            [(in|on|using) [the ]{area_or_player_name}]
          # KRONK change 4: station-first phrasing ("anime pop radio on pandora").
          - (play|listen to) [the ]{media_name} (radio|station) [(on|from|via) pandora][
            (in|on) [the ]{area_or_player_name}]
        playlist_trigger:
          name: Playlist trigger
          description: The trigger sentences to request a specific playlist.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          # KRONK change 5: allow "my" / "YouTube [Music]" before "playlist"
          # ("shuffle my YouTube playlist X" fell through to Kronk, which
          # could not shuffle — 2026-09-16).
          - (shuffle|play|listen to) [my ][the ][(youtube music|youtube|you tube) ]playlist
            {media_name} [(in|on|using) [the ]{area_or_player_name}][ (with|using) {radio_mode}]
        # KRONK change 9: loose phrasings go to Kronk, which picks from the
        # household's taste. Without these, HA's built-in search-and-play
        # intent takes "play some chill music" and plays an album literally
        # named "Some Chill Music".
        loose_trigger:
          name: Loose trigger (handed to Kronk)
          description: Sentences that name a style or nothing specific. Kronk decides what to play.
          selector:
            text:
              multiline: false
              multiple: true
          default:
          - (play|put on|throw on|listen to) some {media_name} [(in|on) [the ]{area_or_player_name}]
          - (play|put on) something {media_name} [(in|on) [the ]{area_or_player_name}]
          - (play|put on) [some ](music|something) [(in|on) [the ]{area_or_player_name}]
        response_input:
          name: Response for Assist
          description: The response which will be given by Assist. `mass_player_where`
            is "in the <room>" when the target was chosen by device or room, else
            "on <player name>"; `mass_player_name` is the raw player name(s).
          selector:
            text:
              multiline: false
              multiple: false
          default: '{{ ''Shuffling'' if ''shuffle'' in trigger.sentence | lower  else
            ''''}} {{ trigger.slots.media_name }} {{ '''' if ''shuffle'' in trigger.sentence
            | lower else ''playing''}} {{ mass_player_where }}'
triggers:
- trigger: conversation
  command: !input album_trigger
  id: album
- trigger: conversation
  command: !input track_trigger
  id: track
- trigger: conversation
  command: !input artist_trigger
  id: artist
- trigger: conversation
  command: !input audiobook_trigger
  id: audiobook
- trigger: conversation
  command: !input radio_trigger
  id: radio
- trigger: conversation
  command: !input playlist_trigger
  id: playlist
- trigger: conversation
  command: !input loose_trigger
  id: loose
actions:
- alias: Define variables to be used in the automation
  variables:
    version: 20250404-kronk10
    shuffle: '{{ ''shuffle'' in trigger.sentence | lower }}'
    default_player_entity_id: !input default_player_entity_id_input
    trigger_id: '{{ trigger.id }}'
    area_or_player_name: '{{ trigger.slots.area_or_player_name | default }}'
    assist_device_id: '{{ trigger.device_id }}'
    action_data:
      media_id: '{{ trigger.slots.media_name }}'
      media_type: '{{ ''radio'' if ''radio'' in media_name | lower else trigger_id
        }}'
      artist: '{{ trigger.slots.artist | default }}'
      radio_mode: '{{ ''radio'' in trigger.slots.radio_mode | default | lower }}'
    ma_players: '{{  integration_entities(''music_assistant'') | select(''match'',
      ''media_player'') | list }}'
    player_entity_id_by_player_name: "{{ ma_players | expand \n  | selectattr('name',
      'match', area_or_player_name ~ '$', ignorecase=true)\n  | map(attribute='entity_id')
      | list }}\n"
    # KRONK change 2: a room with a sync group targets the group only.
    player_entity_id_by_area_name: >-
      {%- set ps = areas() | map('area_name') | select('match', area_or_player_name ~ '$', ignorecase=true)
         | map('area_entities') | sum(start=[]) | select('in', ma_players) | list -%}
      {%- set gs = ps | select('is_state_attr', 'mass_player_type', 'group') | list -%}
      {{ gs or ps }}
    # KRONK change 1: the MA player on the device that heard the request.
    # ESPHome device → MAC (connections) → MA device identifier 'up<mac>'.
    assist_device_mac: >-
      {%- if assist_device_id -%}
      {{ device_attr(assist_device_id, 'connections') | selectattr(0, 'eq', 'mac') | map(attribute=1) | first | default('') }}
      {%- endif -%}
    player_entity_id_by_assist_device: >-
      {%- set ns = namespace(hits=[]) -%}
      {%- if assist_device_mac -%}
        {%- set key = 'up' ~ (assist_device_mac | replace(':', '')) -%}
        {%- for e in ma_players -%}
          {%- set ids = device_attr(device_id(e), 'identifiers') | list -%}
          {%- if ids | selectattr(1, 'eq', key) | list -%}{%- set ns.hits = ns.hits + [e] -%}{%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.hits }}
    player_entity_id_by_assist_area: >-
      {%- set ps = (area_entities(area_id(assist_device_id)) | select('in', ma_players) | list) if assist_device_id else [] -%}
      {%- set gs = ps | select('is_state_attr', 'mass_player_type', 'group') | list -%}
      {{ gs or ps }}
    mass_player_entity_id: "{{ player_entity_id_by_player_name or player_entity_id_by_area_name
      \nor player_entity_id_by_assist_device or player_entity_id_by_assist_area or [default_player_entity_id] }}\n"
    mass_player_name: '{{ mass_player_entity_id | map(''state_attr'', ''friendly_name'')
      | join('', '') }}'
    # KRONK change 3: name the room when the match was by device or room.
    mass_player_where: >-
      {%- set room = area_name(mass_player_entity_id[0]) if mass_player_entity_id else none -%}
      {%- if player_entity_id_by_player_name or not room -%}on {{ mass_player_name }}
      {%- else -%}in the {{ room }}{%- endif -%}
# KRONK change 9: what Kronk gets is the sentence as spoken, plus where the
# satellite that heard it is when no room or player was named —
# conversation.process can't carry the device id, so the target rides in
# the words: the satellite's room, else (a satellite with no area, e.g. the
# basement) its own MA player by name. Kronk's player resolution matches both.
- variables:
    kronk_agent: conversation.ollama_conversation
    kronk_text: >-
      {%- set room = area_name(assist_device_id) if assist_device_id else none -%}
      {%- set own = player_entity_id_by_assist_device | first | default(none) -%}
      {%- if area_or_player_name -%}{{ trigger.sentence }}
      {%- elif room -%}{{ trigger.sentence }} in the {{ room }}
      {%- elif own -%}{{ trigger.sentence }} on the {{ state_attr(own, 'friendly_name') }}
      {%- else -%}{{ trigger.sentence }}{%- endif -%}
- alias: Loose phrasing — Kronk picks
  if:
  - condition: template
    value_template: "{{ trigger_id == 'loose' }}"
  then:
  - action: conversation.process
    continue_on_error: true
    data:
      agent_id: '{{ kronk_agent }}'
      text: '{{ kronk_text }}'
    response_variable: kronk
  - set_conversation_response: >-
      {{ kronk.response.speech.plain.speech if kronk is defined and kronk.response is defined
         else "I couldn't reach Kronk." }}
  # Everything below is the blueprint's own path. Nested under `else`, not
  # cut off with `stop`: a `stop` discarded the conversation response set
  # just before it, and Assist said "Done" (live test 2026-10-21).
  else:
    # KRONK change 6: verify playback before answering (2026-10-04). Upstream
    # lets a failed play_media abort the script, and Assist then speaks its
    # default "Done" — a false success ("French Dinner radio" not on the
    # account). Snapshot the first target, let the call fail without aborting,
    # and wait for that player to be playing something new: a different item,
    # or the same item restarted (position went backwards). Same rule as
    # Kronk's /music (tool_service).
    - alias: Snapshot what the target is playing
      variables:
        verify_entity: '{{ mass_player_entity_id[0] }}'
        before_content: '{{ state_attr(mass_player_entity_id[0], ''media_content_id'') }}'
        before_title: '{{ state_attr(mass_player_entity_id[0], ''media_title'') }}'
        before_position: '{{ state_attr(mass_player_entity_id[0], ''media_position'') | float(0) }}'
        before_state: '{{ states(mass_player_entity_id[0]) }}'
    # KRONK change 8 (2026-10-21): a failed call skips the wait. HA keeps a
    # continue_on_error failure to itself, so the call sits in a nested sequence
    # whose second step only runs when it succeeded. Without this a station
    # that does not exist ("zxqv radio") waited out the full 10 s before "I
    # couldn't play" (INVESTIGATION_2026-10-21_radio_miss_latency.md). Cost: a
    # call that fails and then plays anyway (seen once, MA 2.8.8, 2026-09-04)
    # is reported as a failure while the music starts.
    - variables:
        play_ok: false
        started: false
    # KRONK change 10 (2026-10-21): shuffle before the play. MA shuffles only
    # the items after the current one; set after play_media, "shuffle Old Man
    # Sings" opened on the playlist's track 1 every time. Set before, MA
    # shuffles as it enqueues (3/3 random first tracks, live test). Best
    # effort: a queue in dynamic (radio) mode refuses it (change 7).
    - alias: Set shuffle before the play
      if:
      - condition: template
        value_template: '{{ state_attr(mass_player_entity_id[0], ''shuffle'') != shuffle }}'
      then:
      - action: media_player.shuffle_set
        continue_on_error: true
        data:
          shuffle: '{{ shuffle }}'
        target:
          entity_id: '{{ mass_player_entity_id }}'
    - alias: Send media to selected Music Assistant Player
      continue_on_error: true
      sequence:
      - action: music_assistant.play_media
        data: '{{ dict(action_data.items() | selectattr(''1'')) }}'
        target:
          entity_id: '{{ mass_player_entity_id }}'
      - variables:
          play_ok: true
    - alias: Wait for the player to start the new media
      if:
      - condition: template
        value_template: '{{ play_ok }}'
      then:
      - wait_template: >-
          {{ is_state(verify_entity, 'playing') and (
               before_state != 'playing'
               or state_attr(verify_entity, 'media_content_id') != before_content
               or state_attr(verify_entity, 'media_title') != before_title
               or (state_attr(verify_entity, 'media_position') | float(0)) < before_position ) }}
        timeout: '00:00:10'
        continue_on_timeout: true
      - variables:
          started: '{{ wait.completed }}'
    - if:
      - condition: template
        value_template: '{{ started }}'
      then:
      # KRONK change 7 (2026-10-07): shuffle is best-effort. MA 2.11 refuses
      # shuffle_set on a dynamic radio station ("Invalid or unsupported
      # command"); without this the script aborted after the station had
      # started and Assist spoke its default "Done". Change 10: only when
      # the set before the play didn't take.
      - alias: Enable/Disable shuffle on a Music Assistant Media Player
        if:
        - condition: template
          value_template: '{{ state_attr(mass_player_entity_id[0], ''shuffle'') != shuffle }}'
        then:
        - action: media_player.shuffle_set
          continue_on_error: true
          data:
            shuffle: '{{ shuffle }}'
          target:
            entity_id: '{{ mass_player_entity_id }}'
      - alias: Send back the response
        set_conversation_response: !input response_input
      else:
      # KRONK change 9: MA rejected the words themselves (play_ok false — the
      # call failed, e.g. "Could not resolve ['Destiny Waving by Ulrich
      # Schnauss']"): Kronk's resolver tolerates misspellings, so hand it the
      # sentence. Not radio: a radio miss stays a fast failure (change 8), and
      # not a call that succeeded but never started (that's a provider problem,
      # not the words).
      - if:
        - condition: template
          value_template: "{{ not play_ok and action_data.media_type != 'radio' }}"
        then:
        - action: conversation.process
          continue_on_error: true
          data:
            agent_id: '{{ kronk_agent }}'
            text: '{{ kronk_text }}'
          response_variable: kronk
        - set_conversation_response: >-
            {{ kronk.response.speech.plain.speech if kronk is defined and kronk.response is defined
               else "I couldn't play " ~ trigger.slots.media_name ~ "." }}
        else:
        - alias: Say it failed
          set_conversation_response: >-
            I couldn't play {{ trigger.slots.media_name }}{{ ' radio' if action_data.media_type == 'radio'
            and 'radio' not in trigger.slots.media_name | lower else '' }}.
mode: single
