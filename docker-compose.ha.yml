# Home Assistant — separate compose stack so it survives lifecycle churn on
# the main kronk stack (orchestrator rebuilds, tool_service restarts, etc.).
#
# Networking: HA uses host networking, so it reaches the kronk stack via
# `localhost:80` (nginx → orchestrator + tools), `localhost:10200` (Piper),
# `localhost:10300` (Whisper). No bridge-network sharing required.
#
# Volume: re-uses the pre-existing `kronk_ha-config` volume (created by the
# main compose stack on first boot). `external: true` tells compose "this
# already exists, do not create or destroy it." All HA state — admin account,
# integrations, helpers, automations, voice pipeline, TTS cache — lives here.
#
# Voice recordings (sprint M12): HA's assist_pipeline debug_recording_dir
# (ha/configuration.yaml) is /voice_recordings, the host directory
# /home/drew/kronk-voice-recordings. Create it before the first `up`
# (mkdir -p ~/kronk-voice-recordings); compose refuses to start HA without
# it rather than let Docker create it root-owned. HA runs as root, so the
# files it writes are root-owned, mode 644: readable by the operator and the
# labelling script, removable only through the container or sudo.
#
# Operations:
#   bring up:   docker compose -f docker-compose.ha.yml up -d
#   recreate:   docker compose -f docker-compose.ha.yml up -d homeassistant
#               (needed once for any change to this file; it is an HA restart)
#   restart:    docker compose -f docker-compose.ha.yml restart homeassistant
#               (clean shutdown within stop_grace_period; before the container
#               was recreated with it, Docker killed HA after 10 s:
#               docs/incidents/INCIDENT_2026-11-15_ha_restart_sigkill.md)
#   logs:       journalctl CONTAINER_NAME=homeassistant -f
#   tear down:  docker compose -f docker-compose.ha.yml down       (volume kept)
#               docker compose -f docker-compose.ha.yml down -v    (volume WIPED — don't)

# Project name — gives this stack its own scope so the kronk stack's
# containers don't show up as "orphans" of this project (or vice versa).
name: kronk-ha

services:
  homeassistant:
    # Pinned 2026-06-12 to the running version — HA upgrades are deliberate acts
    # (check release notes, then bump + `up -d`).
    image: ghcr.io/home-assistant/home-assistant:2026.5.4
    container_name: homeassistant
    network_mode: host
    # No `privileged: true` — we don't use USB/Zigbee/Z-Wave/Bluetooth on
    # kronk's HA. The Voice PE handshakes BLE with the phone, then everything
    # is over WiFi/mDNS, which host networking already covers.
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
      # Voice recordings (sprint M12), outside the config volume and the repo.
      - type: bind
        source: /home/drew/kronk-voice-recordings
        target: /voice_recordings
        bind:
          create_host_path: false
    environment:
      - TZ=America/New_York
    # HA needs more than Docker's default 10 s to shut down cleanly; a
    # SIGKILL loses restore-state and the recorder's last writes
    # (INCIDENT_2026-11-15_ha_restart_sigkill.md).
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  ha-config:
    name: kronk_ha-config
    external: true
