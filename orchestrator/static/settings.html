<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronk — Settings</title>
<link rel="stylesheet" href="/static/kronk.css">
<!--
  /settings (sprint M21 step 2; docs/features/config-directory.md). Every
  prompt and tuning value in effect, read only for anyone on the LAN;
  editing behind a passphrase. No framework, no build step. Every piece of
  text from the server is put on the page with textContent (el() below),
  never as HTML, so a prompt holding <script> shows as text. URLs are
  relative on purpose: under /dev/ the same page talks to the dev pair.
-->
<style>
  main { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem 4rem; display: flex; flex-direction: column; gap: 1.5rem; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--text3); font-size: 12px; }
  .mono, pre, code, textarea { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  .badge { font-size: 10px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2);
           border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .badge.prod { color: #fff; background: var(--red); border-color: var(--red); }
  .badge.dev { color: #fff; background: var(--purple); border-color: var(--purple); }
  .badge.on { color: #fff; background: var(--green); border-color: var(--green); }
  .badge.warn { color: #000; background: var(--amber); border-color: var(--amber); }
  .badge.err { color: #fff; background: var(--red); border-color: var(--red); }
  .badge.src-file { color: var(--green); }
  .badge.src-environment { color: var(--amber); }
  .badge.src-code-default { color: var(--text3); }
  details { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; }
  details > summary { cursor: pointer; padding: 0.75rem 1rem; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: '▸ '; color: var(--text3); }
  details[open] > summary::before { content: '▾ '; }
  details > .body { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: 8px; }
  .fname { font-weight: 600; font-family: 'JetBrains Mono', 'Fira Code', monospace; overflow-wrap: anywhere; }
  .key { border-top: 1px solid var(--border); padding: 8px 0 2px; display: grid; gap: 4px 12px;
         grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  .key .k { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; overflow-wrap: anywhere; }
  .key .v { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; overflow-wrap: anywhere; color: var(--text); }
  .key .c { grid-column: 1 / -1; color: var(--text2); font-size: 12px; }
  .key .h { grid-column: 1 / -1; color: var(--text3); font-size: 11px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px; font-size: 12px; max-height: 32rem; overflow: auto; }
  button, .btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 7px; color: var(--text2);
                 font-size: 12px; padding: 6px 14px; cursor: pointer; }
  button:hover { border-color: var(--blue); color: var(--text); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.danger { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type=password] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
                         padding: 6px 10px; font-size: 14px; min-width: 0; flex: 1 1 12rem; }
  textarea { width: 100%; min-height: 22rem; background: var(--bg); color: var(--text); border: 1px solid var(--border);
             border-radius: 6px; padding: 8px; font-size: 12px; line-height: 1.45; }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap;
         overflow-wrap: anywhere; }
  .msg.ok { border-color: var(--green); }
  .msg.bad { border-color: var(--red); }
  .msg.note { border-color: var(--amber); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border-top: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--text3); font-weight: 600; }
  @media (max-width: 640px) {
    .key { grid-template-columns: minmax(0, 1fr); }
    table, thead, tbody, tr, td, th { display: block; }
    thead { display: none; }
    tr { border-top: 1px solid var(--border); padding: 4px 0; }
    td { border: none; padding: 2px 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-dot" id="dot"></div>
  <h1>Settings</h1>
  <span class="subtitle" id="subtitle">kronk</span>
</header>

<main>
  <div class="card" id="status"><span class="muted">loading…</span></div>
  <div id="editor-slot"></div>
  <div>
    <div class="section-label">Files of the live config directory</div>
    <div id="files" class="row" style="flex-direction:column;align-items:stretch;gap:6px"></div>
  </div>
  <div>
    <div class="section-label">Not editable here</div>
    <div id="readonly" class="row" style="flex-direction:column;align-items:stretch;gap:6px"></div>
  </div>
</main>

<script>
'use strict';
// ── DOM: text only ──────────────────────────────────────────────────────────
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat()) {
    if (kid === undefined || kid === null || kid === false) continue;
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const show = v => (v === null || v === undefined) ? 'null' : (typeof v === 'string' ? v : JSON.stringify(v));
const when = c => c ? `${(c.date || '').slice(0, 16).replace('T', ' ')} · ${c.short} · ${c.who}` : 'no commit';

let DATA = null;
let TOKEN = null;           // the second token of an unlocked session (never stored on disk)

async function api(path, opts) {
  const o = Object.assign({ headers: {} }, opts || {});
  if (o.body !== undefined) { o.method = o.method || 'POST'; o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
  if (o.method && o.method !== 'GET' && TOKEN) o.headers['X-Settings-Token'] = TOKEN;
  o.credentials = 'same-origin';
  const r = await fetch(path, o);
  let body = null;
  try { body = await r.json(); } catch { body = { detail: `HTTP ${r.status}` }; }
  return { status: r.status, ok: r.ok, body };
}

// ── status card ─────────────────────────────────────────────────────────────
function renderStatus() {
  const d = DATA, box = document.getElementById('status');
  document.getElementById('subtitle').textContent = `${d.instance} · ${d.release}`;
  document.getElementById('dot').style.background = d.config_errors.length ? 'var(--red)' : 'var(--green)';
  const unlocked = !!d.session.unlocked;
  const kids = [
    el('div', { class: 'row' },
      el('span', { class: 'badge ' + (d.instance === 'production' ? 'prod' : 'dev') }, d.instance.toUpperCase()),
      el('span', { class: 'muted' }, `release ${d.release}`),
      el('span', { class: 'badge ' + (d.editing.enabled ? 'on' : '') }, d.editing.enabled ? 'editing on' : 'read only'),
      unlocked ? el('span', { class: 'badge warn' }, 'unlocked') : null),
    el('div', { class: 'muted', style: 'margin-top:6px' }, `live config directory ${d.dir} · git ${d.git.ok ? 'HEAD ' + d.git.head : 'unavailable'}`),
  ];
  if (!d.editing.enabled) kids.push(el('div', { class: 'msg note', style: 'margin-top:8px' }, d.editing.reason + '\n' + d.editing.how));
  for (const e of d.config_errors) kids.push(el('div', { class: 'msg bad', style: 'margin-top:8px' },
    `${e.service}: config error in effect: ${e.file}${e.line ? ':' + e.line : ''}: ${e.message}` + (e.kept ? ` (kept: ${e.kept})` : '')));
  for (const w of d.config_warnings) kids.push(el('div', { class: 'msg note', style: 'margin-top:8px' },
    `${w.service}: warning: ${w.file}${w.line ? ':' + w.line : ''}: ${w.message}`));
  if (d.editing.enabled) {
    if (unlocked) {
      kids.push(el('div', { class: 'row', style: 'margin-top:8px' },
        el('span', { class: 'muted' }, `session ends after ${Math.round(d.session.idle_s / 60)} min idle, ${Math.round(d.session.absolute_s / 3600)} h at most`),
        el('button', { onclick: lock }, 'Lock')));
    } else {
      const pw = el('input', { type: 'password', autocomplete: 'current-password', placeholder: 'passphrase', id: 'pw' });
      const form = el('form', { class: 'row', style: 'margin-top:8px', onsubmit: ev => { ev.preventDefault(); unlock(pw.value); pw.value = ''; } },
        pw, el('button', { class: 'primary', type: 'submit' }, 'Unlock to edit'));
      kids.push(form, el('div', { id: 'unlock-msg' }));
    }
  }
  box.replaceChildren(...kids);
}

async function unlock(passphrase) {
  const r = await api('api/settings/unlock', { body: { passphrase } });
  if (r.ok) { TOKEN = r.body.token; await load(); return; }
  document.getElementById('unlock-msg').replaceChildren(el('div', { class: 'msg bad', style: 'margin-top:6px' }, r.body.detail || 'refused'));
}
async function lock() {
  await api('api/settings/lock', { body: {} });
  TOKEN = null; closeEditor(); await load();
}

// ── files ───────────────────────────────────────────────────────────────────
function keyRow(k) {
  return el('div', { class: 'key' },
    el('div', { class: 'k' }, k.key),
    el('div', { class: 'v' }, show(k.value), ' ',
      el('span', { class: 'badge src-' + k.source.replace(' ', '-') }, k.source + (k.env ? ` ${k.env}` : '')),
      k.source !== 'file' ? null : null),
    k.comment ? el('div', { class: 'c' }, k.comment) : null,
    el('div', { class: 'h' }, `default ${show(k.default)}` +
      (Object.keys(k.bounds || {}).length ? ` · bounds ${JSON.stringify(k.bounds)}` : '') +
      ` · ${k.type} · last changed ${when(k.last_change)}`));
}

function fileCard(f) {
  const badges = [el('span', { class: 'badge' }, f.owner)];
  if (f.uncommitted) badges.push(el('span', { class: 'badge warn' }, 'uncommitted change on disk'));
  if (f.differs_from_effect) badges.push(el('span', { class: 'badge err' }, 'file differs from what is in effect'));
  if (f.dev && f.dev.differs) badges.push(el('span', { class: 'badge dev' }, 'dev differs'));
  if (f.error) badges.push(el('span', { class: 'badge err' }, f.error));
  const body = [el('div', { class: 'muted' }, `${f.description} · ${f.size_bytes ?? '?'} of ${f.limit_bytes} bytes · last change ${when(f.last_change)}` +
    (f.last_change ? ` “${f.last_change.subject}”` : ''))];
  if (f.git_error) body.push(el('div', { class: 'msg bad' }, f.git_error));
  if (f.kind === 'prompt') {
    body.push(el('div', { class: 'muted' }, `prompt in effect (${f.prompt_source}), whole:`), el('pre', {}, f.prompt_in_effect ?? '(none)'));
  } else {
    if (f.keys_error) body.push(el('div', { class: 'msg bad' }, f.keys_error));
    let section = null;
    for (const k of f.keys) {
      const top = k.key.split('.').slice(0, -1).join('.');
      if (top !== section) { section = top; if (top) body.push(el('div', { class: 'muted', style: 'margin-top:6px' }, top + (k.section_comment ? ' — ' + k.section_comment : ''))); }
      body.push(keyRow(k));
    }
  }
  const actions = el('div', { class: 'row' }, el('button', { onclick: () => openHistory(f.name) }, 'History'));
  if (DATA.session.unlocked) actions.prepend(el('button', { class: 'primary', onclick: () => openEditor(f.name) }, 'Edit'));
  body.push(actions);
  return el('details', { 'data-file': f.name },
    el('summary', {}, el('span', { class: 'fname' }, f.name), ' ', badges),
    el('div', { class: 'body' }, body));
}

function renderFiles() {
  document.getElementById('files').replaceChildren(...DATA.files.map(fileCard));
}

// ── editor ──────────────────────────────────────────────────────────────────
let EDIT = null;   // {name, base, kind}
function closeEditor() { EDIT = null; document.getElementById('editor-slot').replaceChildren(); }

async function openEditor(name, preset) {
  const r = await api('api/settings/file?name=' + encodeURIComponent(name));
  if (!r.ok) { alert(r.body.detail); return; }
  const f = DATA.files.find(x => x.name === name);
  EDIT = { name, base: r.body.blob, kind: f.kind };
  const ta = el('textarea', { id: 'ed-text', spellcheck: 'false' });
  ta.value = preset !== undefined ? preset : r.body.text;
  const out = el('div', { id: 'ed-out', class: 'row', style: 'flex-direction:column;align-items:stretch;gap:6px' });
  const buttons = el('div', { class: 'row' },
    el('button', { onclick: () => check() }, 'Check'),
    el('button', { class: 'primary', onclick: () => save([]) }, 'Save'),
    DATA.instance === 'production' && DATA.dev_url && f.kind === 'prompt' ? el('button', { onclick: () => applyDev() }, 'Apply to dev first') : null,
    DATA.instance === 'production' && DATA.dev_url ? el('button', { onclick: () => fromDev() }, 'Bring over from dev') : null,
    el('button', { onclick: closeEditor }, 'Close'));
  const kids = [el('div', { class: 'row' }, el('span', { class: 'fname' }, `Editing ${name}`), el('span', { class: 'muted' }, `base ${EDIT.base.slice(0, 7)}`))];
  if (f.kind === 'prompt') kids.push(el('div', { class: 'msg note' },
    'A saved prompt reaches the household at once: the next request uses it. The model re-reads the whole prompt ' +
    'on that request (llama.cpp\'s cached prefix is invalidated), so that one request is slower. ' +
    (DATA.instance === 'production' && DATA.dev_url ? 'Apply to dev first tries it on the dev pair (Hey Jarvis) without touching production.' : '')));
  if (name === 'music.yaml' || name === 'lead_in.yaml') kids.push(el('div', { class: 'msg note' },
    'A save of this file first runs the voice corpus (routing, parser and decision, offline: no network, nothing plays) ' +
    'against your text and shows rows whose outcome changes. A row that newly fails blocks the save unless you override it.'));
  kids.push(ta, buttons, out);
  document.getElementById('editor-slot').replaceChildren(el('div', { class: 'card', style: 'display:flex;flex-direction:column;gap:8px' }, kids));
  ta.focus();
}

function problems(list) {
  return list.map(p => el('div', { class: 'msg bad' }, `${p.file || ''}${p.line ? ':' + p.line : ''}: ${p.message}`));
}

function corpusView(c, overridable) {
  if (!c) return [];
  const out = [el('div', { class: 'msg ' + (c.newly_failing.length ? 'bad' : 'ok') },
    `voice corpus (${c.rows_checked} rows, corpus ${c.corpus_digest}): ${c.changed.length} rows change outcome, ` +
    `${c.newly_failing.length} newly fail` + (c.note ? `\n${c.note}` : ''))];
  for (const row of c.changed) {
    const box = overridable && row.newly_fails ? el('input', { type: 'checkbox', 'data-override': row.id }) : null;
    out.push(el('div', { class: 'msg ' + (row.newly_fails ? 'bad' : 'note') }, box, ' ',
      `${row.id} (${row.layer}): “${row.text}”\n  in effect: ${row.before}\n  with yours: ${row.after}` +
      (row.newly_fails ? '\n  newly fails: ' + row.why : '')));
  }
  return out;
}

async function check() {
  const r = await api('api/settings/check', { body: { name: EDIT.name, text: document.getElementById('ed-text').value } });
  const out = document.getElementById('ed-out');
  if (!r.ok && r.status !== 422) { out.replaceChildren(el('div', { class: 'msg bad' }, r.body.detail || 'check failed')); return; }
  const kids = r.body.ok ? [el('div', { class: 'msg ok' }, 'valid' + (r.body.changed_keys ? ': ' + r.body.changed_keys.join(', ') : ''))]
                         : problems(r.body.errors || []);
  kids.push(...corpusView(r.body.corpus, true));
  out.replaceChildren(...kids);
}

async function save(extraOverrides) {
  const overrides = [...document.querySelectorAll('[data-override]')].filter(b => b.checked).map(b => b.dataset.override).concat(extraOverrides);
  const r = await api('api/settings/save', { body: { name: EDIT.name, text: document.getElementById('ed-text').value, base: EDIT.base, overrides } });
  const out = document.getElementById('ed-out');
  if (r.ok) {
    out.replaceChildren(el('div', { class: 'msg ok' }, r.body.message), ...(r.body.warnings || []).map(w => el('div', { class: 'msg note' }, w)));
    EDIT.base = r.body.blob || EDIT.base;
    await load(true);
    return;
  }
  const b = r.body, kids = [el('div', { class: 'msg bad' }, b.detail || b.message || `HTTP ${r.status}`)];
  if (b.errors) kids.push(...problems(b.errors));
  if (b.conflict) kids.push(el('div', { class: 'muted' }, `changed meanwhile by ${b.conflict.who || 'someone'} (${b.conflict.subject || 'uncommitted'}). What they changed:`),
    el('pre', {}, b.conflict.their_change || '(not available)'), el('div', { class: 'muted' }, 'The file now, against your text:'), el('pre', {}, b.conflict.yours_vs_current));
  if (b.corpus) kids.push(...corpusView(b.corpus, true));
  out.replaceChildren(...kids);
}

async function applyDev() {
  const r = await api('api/settings/apply_dev', { body: { name: EDIT.name, text: document.getElementById('ed-text').value } });
  const out = document.getElementById('ed-out');
  out.replaceChildren(el('div', { class: 'msg ' + (r.ok ? 'ok' : 'bad') }, r.body.message || r.body.detail || `HTTP ${r.status}`),
    ...problems(r.body.errors || []), ...corpusView(r.body.corpus, false));
  if (r.ok) await load(true);
}

async function fromDev() {
  const r = await api('api/settings/dev_file?name=' + encodeURIComponent(EDIT.name));
  if (!r.ok) { document.getElementById('ed-out').replaceChildren(el('div', { class: 'msg bad' }, r.body.detail || 'dev did not answer')); return; }
  document.getElementById('ed-text').value = r.body.text;
  document.getElementById('ed-out').replaceChildren(el('div', { class: 'msg note' }, `Loaded dev's ${EDIT.name} (dev HEAD ${(r.body.head || '').slice(0, 7)}). Check, then Save to take it into ${DATA.instance}.`));
}

// ── history ─────────────────────────────────────────────────────────────────
async function openHistory(name) {
  const r = await api('api/settings/history?name=' + encodeURIComponent(name));
  const slot = document.getElementById('editor-slot');
  if (!r.ok) { slot.replaceChildren(el('div', { class: 'msg bad' }, r.body.detail || 'no history')); return; }
  const rows = r.body.commits.map(c => {
    const diff = el('pre', { hidden: true });
    const revertBtn = DATA.session.unlocked && c.revertable ? el('button', { class: 'danger', onclick: () => revert(name, c.commit) }, 'Revert') : null;
    return el('div', { class: 'key' },
      el('div', { class: 'k' }, `${(c.date || '').slice(0, 16).replace('T', ' ')} ${c.short}`),
      el('div', { class: 'v' }, `${c.subject} — ${c.who}`),
      el('div', { class: 'c row' }, el('button', { onclick: async () => {
        if (diff.hidden) { const d = await api(`api/settings/diff?name=${encodeURIComponent(name)}&commit=${c.commit}`); diff.textContent = d.body.diff || d.body.detail; }
        diff.hidden = !diff.hidden; } }, 'Diff'), revertBtn),
      el('div', { class: 'c' }, diff));
  });
  slot.replaceChildren(el('div', { class: 'card', style: 'display:flex;flex-direction:column;gap:6px' },
    el('div', { class: 'row' }, el('span', { class: 'fname' }, `History of ${name}`), el('button', { onclick: closeEditor }, 'Close')),
    el('div', { id: 'hist-out' }), rows.length ? rows : el('div', { class: 'muted' }, 'no commits')));
}

async function revert(name, commit) {
  const f = DATA.files.find(x => x.name === name);
  const r = await api('api/settings/revert', { body: { name, commit, base: f.blob } });
  const out = document.getElementById('hist-out');
  out.replaceChildren(el('div', { class: 'msg ' + (r.ok ? 'ok' : 'bad') }, r.body.message || r.body.detail || `HTTP ${r.status}`),
    ...problems(r.body.errors || []), ...corpusView(r.body.corpus, false));
  if (r.ok) { await load(true); openHistory(name); }
}

// ── read-only sections ──────────────────────────────────────────────────────
function table(head, rows) {
  return el('table', {}, el('thead', {}, el('tr', {}, head.map(h => el('th', {}, h)))),
    el('tbody', {}, rows.map(r => el('tr', {}, r.map(c => el('td', {}, c))))));
}
function section(title, where, kids) {
  return el('details', {}, el('summary', {}, el('b', {}, title), ' ', el('span', { class: 'badge' }, 'not editable here')),
    el('div', { class: 'body' }, where ? el('div', { class: 'muted' }, 'Where to change it: ' + where) : null, kids));
}
function renderReadonly() {
  const ro = DATA.readonly, inst = DATA.instance;
  const envRows = list => list.map(e => [el('span', { class: 'mono' }, e.name), e.value ?? `(unset: ${e.default})`, e.what, e.change[inst] || e.change.production]);
  const m = ro.models;
  const kids = [
    section('Routing rules, in order', ro.routing_where, table(['#', 'rule', 'route', 'what it matches'],
      ro.routing.map(r => [String(r.order), el('span', { class: 'mono' }, r.name), r.route + (r.direct ? ' (runs the tool, no model)' : ''),
        el('div', {}, r.doc, r.patterns.map(p => el('pre', {}, `${p.name}: ${p.source}`)))]))),
    section('Environment settings: orchestrator', null, table(['name', 'value', 'what', 'where to change'], envRows(ro.env.orchestrator))),
    section('Environment settings: tool_service', null, table(['name', 'value', 'what', 'where to change'], envRows(ro.env.tool_service))),
    section('Model servers (as read from the running servers)', m.where, [
      m.props_error ? el('div', { class: 'msg note' }, m.props_error) : el('div', { class: 'muted' }, `read ${m.props_age_s} s ago`),
      table(['model', 'port', 'agents', 'context', 'slots', 'sampling', 'flags'], m.servers.map(s => [
        el('span', { class: 'mono' }, s.name), String(s.port ?? ''), s.agents.join(', '),
        `${s.n_ctx ?? '?'} tokens`, String(s.slots ?? ''),
        s.sampling ? el('pre', {}, JSON.stringify(s.sampling, null, 1)) : (s.running ? '' : 'not running'),
        s.flags ? el('pre', {}, JSON.stringify(s.flags, null, 1)) : ''
      ]))]),
    section('Agents', 'orchestrator/agents.py AGENTS; models from the environment', table(['agent', 'model', 'round budget', 'tools'],
      ro.agents.map(a => [a.name, a.model, String(a.rounds), a.tools.join(', ')]))),
    section('Tool descriptions', 'orchestrator/tools.py TOOL_DEFINITIONS, orchestrator/agents.py', table(['tool', 'offered to', 'description and parameters'],
      ro.tools.map(t => [el('span', { class: 'mono' }, t.name), t.offered_to.join(', '), el('div', {}, t.description, el('pre', {}, JSON.stringify(t.parameters, null, 1)))]))),
    section('Model-facing text in code', 'the file named on each row; commit, tag, deploy', table(['what', 'where', 'text'],
      [...ro.code_text.orchestrator, ...ro.code_text.tool_service].map(c => [c.name, el('span', { class: 'mono' }, c.where),
        el('div', {}, c.note ? el('div', { class: 'muted' }, c.note) : null, c.text !== null && c.text !== undefined ? el('pre', {}, c.text) : null)]))),
    section('Structural guards (code, never a setting)', 'code only, by design: nothing on this page can loosen them', table(['guard', 'what holds', 'where'],
      ro.guards.map(g => [g.name, g.what, el('span', { class: 'mono' }, g.where)]))),
    section('Host-side settings', null, table(['what', 'where', 'how it changes'], ro.host_side.map(h => [h.name, el('span', { class: 'mono' }, h.where), h.how]))),
  ];
  document.getElementById('readonly').replaceChildren(...kids);
}

async function load(keepEditor) {
  const r = await api('api/settings');
  if (!r.ok) { document.getElementById('status').replaceChildren(el('div', { class: 'msg bad' }, r.body.detail || `api/settings: HTTP ${r.status}`)); return; }
  DATA = r.body;
  if (DATA.session.unlocked && DATA.session.token) TOKEN = DATA.session.token;
  if (!DATA.session.unlocked) TOKEN = null;
  const open = new Set([...document.querySelectorAll('details[open][data-file]')].map(d => d.dataset.file));
  renderStatus(); renderFiles(); if (!document.getElementById('readonly').children.length) renderReadonly();
  for (const d of document.querySelectorAll('details[data-file]')) if (open.has(d.dataset.file)) d.open = true;
  if (!keepEditor && !DATA.session.unlocked) closeEditor();
}
load();
</script>
