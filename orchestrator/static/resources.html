<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronk — Resources</title>
<link rel="stylesheet" href="static/kronk.css">
<style>
  header { position: sticky; top: 0; z-index: 10; gap: 12px; }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .last-updated { font-size: 11px; color: var(--text3); font-family: monospace; }
  .refresh-btn {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); font-size: 12px; padding: 4px 12px; cursor: pointer; transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  /* ── Memory bar ─────────────────────────────────────────────────────── */
  .mem-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.1rem 1.3rem;
  }
  .mem-bar-track {
    height: 28px; background: var(--bg3); border-radius: 6px;
    overflow: hidden; display: flex; gap: 1px; margin: 0.75rem 0 0.6rem;
  }
  .mem-bar-seg {
    height: 100%; transition: width 0.4s ease; position: relative; min-width: 2px;
  }
  .mem-bar-seg .seg-label {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden;
    padding: 0 4px; pointer-events: none;
  }
  .mem-legend { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .mem-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .mem-legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .mem-stats { display: flex; gap: 24px; margin-top: 0.9rem; flex-wrap: wrap; }
  .mem-stat { font-size: 12px; color: var(--text3); }
  .mem-stat strong { color: var(--text2); font-weight: 600; }

  /* ── Server cards ───────────────────────────────────────────────────── */
  .server-grid { display: flex; flex-direction: column; gap: 12px; }

  .server-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.2rem 1.4rem;
  }

  .server-card-top {
    display: flex; align-items: flex-start; gap: 14px;
  }

  .server-color-bar {
    width: 4px; border-radius: 2px; flex-shrink: 0;
    align-self: stretch; min-height: 50px;
  }

  .server-main { flex: 1; min-width: 0; }

  .server-name-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 3px;
  }

  .server-name { font-size: 15px; font-weight: 600; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--text3); transition: background 0.3s;
  }
  .status-dot.ok     { background: var(--green); }
  .status-dot.error  { background: var(--red); }

  .server-meta {
    font-size: 12px; color: var(--text3); display: flex;
    gap: 12px; flex-wrap: wrap; margin-bottom: 8px;
  }

  .badge {
    font-size: 10px; border-radius: 4px; padding: 1px 7px; font-weight: 500;
  }
  .badge-quant {
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text3); font-family: 'JetBrains Mono', monospace;
  }

  .server-right {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 6px; flex-shrink: 0;
  }
  .server-vram { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-family: monospace; }
  .server-vram-sub { font-size: 11px; color: var(--text3); }

  /* ── Sources, stale marks, groups (M25) ─────────────────────────────── */
  .src { font-size: 11px; color: var(--text3); margin-top: 0.6rem; line-height: 1.5; }
  .src .stale, .stale { color: #f59e0b; font-weight: 600; }
  .src code { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
  .group-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin: 4px 0 -4px; }
  .server-facts { font-size: 12px; color: var(--text2); display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  .server-facts .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; word-break: break-all; }
  .reason { font-size: 12px; color: var(--text3); font-style: italic; }
  .act-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .act-table th { text-align: left; color: var(--text3); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .act-table td { padding: 5px 8px; color: var(--text2); border-bottom: 1px solid var(--border); }
  .act-table td.num, .act-table th.num { text-align: right; font-family: monospace; }
  .act-table tr.apart td { color: var(--text3); }

  /* ── Agent chips ───────────────────────────────────────────────────── */
  .agent-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .agent-chip {
    font-size: 11px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 10px; color: var(--text2);
    display: flex; align-items: center; gap: 4px;
  }
  .agent-chip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>Resources</h1>
  <div class="header-right">
    <span class="last-updated" id="last-updated">—</span>
    <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  </div>
</header>

<main>

  <!-- Memory overview -->
  <div>
    <div class="section-label">System Memory</div>
    <div class="mem-card">
      <div class="mem-bar-track" id="mem-bar"></div>
      <div class="mem-legend" id="mem-legend"></div>
      <div class="src" id="mem-note"></div>
      <div class="mem-stats" id="mem-stats"></div>
      <div class="src" id="mem-src"></div>
    </div>
  </div>

  <!-- Disk used by model files -->
  <div>
    <div class="section-label">Model files on disk</div>
    <div class="mem-card">
      <div class="mem-stats" id="disk-stats" style="margin-top:0"></div>
      <div class="src" id="disk-src"></div>
    </div>
  </div>

  <!-- Model servers -->
  <div>
    <div class="section-label">Model servers</div>
    <div class="src" id="server-src" style="margin:0 0 10px"></div>
    <div class="server-grid" id="server-grid">
      <div style="color:var(--text3);font-size:13px;padding:1rem">fetching…</div>
    </div>
  </div>

  <!-- Other GPU processes -->
  <div>
    <div class="section-label">Other GPU processes</div>
    <div class="server-grid" id="other-grid"></div>
  </div>

  <!-- Activity -->
  <div>
    <div class="section-label">Calls from this Kronk, last 24 hours</div>
    <div class="mem-card">
      <div id="activity"></div>
      <div class="src" id="activity-src"></div>
    </div>
  </div>

</main>

<script src="static/js/kronk.js"></script>
<script>
// Every figure on this page is measured (M25): the host exporters' files
// (gpu_mem.json, llama_props.json), /proc and sysfs read at the request,
// and this orchestrator's llm_metrics. A fact with no fresh source arrives
// as null with a reason, and the page shows the reason, never a number.
// URLs are relative, so /dev/resources shows dev's data.
// docs/features/resources-live-memory.md

// Deterministic palette keyed by server name, so colors are stable across reloads.
const PALETTE = ['#10b981', '#3b82f6', '#8b5cf6', '#f59e0b', '#ec4899', '#06b6d4', '#ef4444'];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── Formatters ────────────────────────────────────────────────────────────────

const GIB = 2 ** 30;
// Sizes arrive in bytes; the page says GiB.
function fmtGiB(b) {
  if (b == null) return null;
  const g = b / GIB;
  return (g < 1 ? g.toFixed(2) : g.toFixed(1)) + ' GiB';
}
const fmtInt = n => Number(n).toLocaleString('en-US');
const fmtLocal = iso => new Date(iso).toLocaleString();

// One line per source: what it is, how old, and STALE when it is.
function srcLine(label, src) {
  if (!src) return '';
  const name = `<code>${esc(src.file)}</code>`;
  if (src.state === 'fresh')
    return `${esc(label)}: ${name}, written ${Math.round(src.age_s)} s ago (every ${src.every_s} s)`;
  if (src.state === 'stale')
    return `${esc(label)}: ${name} <span class="stale">STALE, written ${Math.round(src.age_s)} s ago</span>; figures from it are withheld`;
  return `${esc(label)}: <span class="stale">${esc(src.reason)}</span>`;
}

// ── Memory bar ────────────────────────────────────────────────────────────────

// The bar's labels by the state of gpu_mem.json (M25 fix round 1, S2).
// Fresh: one segment per listed process, its GPU memory (GTT + VRAM, DRM
// fdinfo); the next segment is used RAM minus those. A card's RAM figure
// is RSS, which counts memory-mapped model files; those are page cache,
// which the kernel counts as available, so the cards' RAM need not fit
// inside that segment (fix round 2, B1: Talkie's mapped model file is
// 13.2 GiB of its 14.9 GiB). Stale, missing or unreadable: no per-process
// segment, and the one used segment says it is all used RAM; GTT is
// system RAM and the GTT in use is inside it.
// Kept as a JSON literal: tests/test_m25_fix1_pages.py reads it (the
// suite has no JavaScript runtime). "{name}" is the process.
const MEM_BAR_LABELS = {
  "fresh": {
    "proc": "{name} GPU memory",
    "other": "Other used RAM",
    "note": "Per-process segments are GPU memory (GTT + VRAM). Other used RAM is used RAM minus them. A card's RAM figure includes memory-mapped model files, which the kernel counts as available, so the cards' RAM need not fit inside Other used RAM."
  },
  "withheld": {
    "proc": null,
    "other": "Used RAM, all of it (per-process GPU memory not known)",
    "note": "Per-process GPU memory is not known (gpu_mem.json, below), so it is not split out. GTT is system RAM: the GTT in use (below) is inside used RAM."
  }
};

function memBarLabels(gpuMemSource) {
  return MEM_BAR_LABELS[gpuMemSource?.state === 'fresh' ? 'fresh' : 'withheld'];
}

// The stats line's word for a gpu_mem.json that is not fresh: the
// source's own state, never "stale" for all three (fix round 2, S1).
const MEM_STAT_WORD = {"stale": "stale", "missing": "missing", "unreadable": "unreadable"};

function memStatWord(gpuMemSource) {
  return MEM_STAT_WORD[gpuMemSource?.state] || 'not known';
}

// Pure: the bar's segments from the two payloads. The listed processes
// are the catalog's running servers and the other GPU processes (Whisper,
// any llama unit not in the catalog).
function memBarSegments(sys, srv) {
  const total = sys.mem_total, available = sys.mem_available;
  const L = memBarLabels(srv.sources?.gpu_mem);
  const procs = L.proc == null ? [] : [
    ...(srv.servers || []).filter(s => s.gpu_bytes > 0).map(s => ({ name: s.name, bytes: s.gpu_bytes })),
    ...(srv.other_processes || []).filter(o => o.gpu_bytes > 0).map(o => ({ name: o.unit, bytes: o.gpu_bytes })),
  ];
  const gpuBytes = procs.reduce((a, p) => a + p.bytes, 0);
  const other = Math.max(0, total - available - gpuBytes);
  return {
    gpuBytes, note: L.note,
    segs: [
      ...procs.map(p => ({ label: L.proc.replace('{name}', p.name), bytes: p.bytes, color: colorFor(p.name) })),
      { label: L.other,      bytes: other,     color: '#2a3044' },
      { label: 'Available',  bytes: available, color: '#1a1f2e' },
    ],
  };
}

function renderMemBar(sys, srv) {
  const total = sys.mem_total;
  if (!total) return;
  const available = sys.mem_available;
  const { segs, gpuBytes, note } = memBarSegments(sys, srv);

  document.getElementById('mem-bar').innerHTML = segs.map(s => {
    const pct = (s.bytes / total * 100).toFixed(2);
    const showLabel = s.bytes / total > 0.05;
    return `<div class="mem-bar-seg" style="width:${pct}%;background:${s.color}" title="${esc(s.label)}: ${fmtGiB(s.bytes)}">
      ${showLabel ? `<span class="seg-label">${fmtGiB(s.bytes)}</span>` : ''}
    </div>`;
  }).join('');

  document.getElementById('mem-legend').innerHTML = segs.slice(0, -1).map(s =>
    `<span class="mem-legend-item">
      <span class="mem-legend-dot" style="background:${s.color}"></span>
      ${esc(s.label)} — ${fmtGiB(s.bytes)}
    </span>`
  ).join('');
  document.getElementById('mem-note').textContent = note;

  const used = total - available;
  // mem_free is the immediately-available pool (not counting reclaimable
  // page cache). The 2026-05-31 incident showed this dropping from 4.7 GB
  // to 1.7 GB right before a hard hang, while "Available" stayed at 34 GB —
  // so surfacing it explicitly with thresholds is the early-warning signal.
  // See docs/INCIDENT_2026-05-31.md.
  const free = sys.mem_free || 0;
  const freeGiB = free / GIB;
  let freeColor = 'var(--text2)';
  let freeNote  = '';
  if      (freeGiB < 2)  { freeColor = '#ef4444'; freeNote = ' ⚠ low'; }   // red
  else if (freeGiB < 4)  { freeColor = '#f59e0b'; freeNote = ' ⚠ tight'; } // amber
  else if (freeGiB < 8)  { freeColor = '#eab308'; }                        // yellow

  // GTT — GPU memory carved from system RAM (shared pool with CPU). Models
  // loaded into llama.cpp servers live here. Pressure here = pressure on
  // CPU memory too on this hardware (Radeon 8060S iGPU).
  const gttTotal = sys.gtt_total, gttUsed = sys.gtt_used;
  const gttPct   = gttTotal ? (gttUsed / gttTotal * 100) : 0;
  let gttColor = 'var(--text2)';
  if      (gttPct > 90) gttColor = '#ef4444';
  else if (gttPct > 75) gttColor = '#f59e0b';

  const memFresh = srv.sources && srv.sources.gpu_mem.state === 'fresh';
  document.getElementById('mem-stats').innerHTML = `
    <span class="mem-stat">Total <strong>${fmtGiB(total)}</strong></span>
    <span class="mem-stat">Used <strong>${fmtGiB(used)} (${(used/total*100).toFixed(0)}%)</strong></span>
    <span class="mem-stat">Available <strong>${fmtGiB(available)}</strong></span>
    <span class="mem-stat" title="Immediately-available pool — dropping below 2 GiB precedes hard hangs on this hardware">
      Free <strong style="color:${freeColor}">${fmtGiB(free)}${freeNote}</strong>
    </span>
    <span class="mem-stat">GPU memory, listed processes <strong>${memFresh ? fmtGiB(gpuBytes) : `<span class="stale">${esc(memStatWord(srv.sources?.gpu_mem))}</span>`}</strong></span>
    ${gttTotal != null ? `
    <span class="mem-stat" title="GPU memory pool (shared with CPU on this iGPU)">
      GTT <strong style="color:${gttColor}">${fmtGiB(gttUsed)} / ${fmtGiB(gttTotal)} (${gttPct.toFixed(0)}%)</strong>
    </span>` : `<span class="mem-stat">GTT <strong class="reason">${esc(sys.gpu_reasons?.gtt_total)}</strong></span>`}
    <span class="mem-stat" title="gpu_busy_percent: one instant, not an average">
      GPU busy <strong>${sys.gpu_busy_percent != null ? sys.gpu_busy_percent + ' % (instant reading)' : esc(sys.gpu_reasons?.gpu_busy_percent || 'unknown')}</strong>
    </span>
  `;
  const at = sys.read_at ? new Date(sys.read_at).toLocaleTimeString() : '';
  document.getElementById('mem-src').innerHTML =
    `RAM: <code>/proc/meminfo</code>; GTT and GPU busy: <code>${esc(sys.sources?.gpu || 'sysfs')}</code>; read ${at}. ` +
    srcLine('Per-process GPU memory', srv.sources?.gpu_mem);
}

// ── Disk ──────────────────────────────────────────────────────────────────────

function renderDisk(sys) {
  const el = document.getElementById('disk-stats');
  const d = sys.disk;
  if (!d) {
    el.innerHTML = `<span class="reason">${esc(sys.disk_reason || 'no disk figures')}</span>`;
  } else {
    el.innerHTML = `<span class="mem-stat">Loaded model and draft files <strong>${fmtGiB(d.model_files_bytes)}</strong></span>` +
      d.filesystems.map(fs => fs.error
        ? `<span class="mem-stat">${esc(fs.files.join(', '))} <strong class="reason">${esc(fs.error)}</strong></span>`
        : `<span class="mem-stat" title="${esc(fs.files.join(', '))}">Filesystem <code>${esc(fs.mount)}</code>
             <strong>${fmtGiB(fs.avail_bytes)} free of ${fmtGiB(fs.size_bytes)}</strong> (${fs.files.length} model file${fs.files.length === 1 ? '' : 's'})</span>`
      ).join('');
  }
  document.getElementById('disk-src').innerHTML =
    srcLine('Sizes by stat and statvfs on the host', sys.sources?.disk);
}

// ── Server cards ──────────────────────────────────────────────────────────────

const STATE_LABEL = { running: 'running', not_running: 'configured, not running', unknown: 'state unknown' };
const HEALTH = {
  answering:     { cls: 'ok',    text: 'answering /props', color: 'var(--green)' },
  not_answering: { cls: 'error', text: 'not answering',    color: 'var(--red)' },
  unknown:       { cls: '',      text: 'health unknown',   color: 'var(--text3)' },
};

function factOr(sv, key, render) {
  return sv[key] != null ? render(sv[key]) : `<span class="reason">${esc(sv.reasons?.[key] || 'unknown')}</span>`;
}

function fileLine(sv, word, fileKey, bytesKey) {
  if (sv[fileKey] == null) {
    const why = sv.reasons?.[fileKey];
    return why === 'the server runs no draft model' ? '' :
      `<div>${word}: <span class="reason">${esc(why || 'unknown')}</span></div>`;
  }
  const size = sv[bytesKey] != null ? fmtGiB(sv[bytesKey]) : `<span class="reason">${esc(sv.reasons?.[bytesKey])}</span>`;
  return `<div>${word} <span class="mono">${esc(sv[fileKey])}</span> · ${size}</div>`;
}

function serverCard(sv) {
  const color = colorFor(sv.name);
  const h = HEALTH[sv.health] || HEALTH.unknown;
  const chips = (sv.agents || []).map(a =>
    `<span class="agent-chip"><span class="agent-chip-dot" style="background:${color}"></span>${esc(a)}</span>`
  ).join('') || `<span class="agent-chip" style="opacity:0.5">unassigned</span>`;

  let facts;
  const r = sv.reasons || {};
  if (sv.state === 'not_running') {
    facts = `<div class="reason">${esc(sv.state_reason)}</div>`;
  } else if (sv.n_ctx == null && sv.model_file == null && r.n_ctx && r.n_ctx === r.model_file) {
    // No props facts, one cause (stale file, not answering): say it once.
    facts = `<div>context, slots, files: <span class="reason">${esc(r.n_ctx)}</span></div>
      ${sv.state === 'unknown' ? `<div class="reason">state unknown: ${esc(sv.state_reason)}</div>` : ''}
      ${sv.health_reason && sv.health_reason !== r.n_ctx ? `<div class="reason">${esc(sv.health_reason)}</div>` : ''}`;
  } else {
    // Context and slots null for one cause (a /props error): say it once,
    // and not again as the health line (M25 fix round 1, N9).
    const propsWhy = sv.n_ctx == null && sv.total_slots == null && r.n_ctx && r.n_ctx === r.total_slots ? r.n_ctx : null;
    facts = `
      ${propsWhy ? `<div>context, slots: <span class="reason">${esc(propsWhy)}</span></div>` : `
      <div>context ${factOr(sv, 'n_ctx', v => `<strong>${v}</strong> tokens`)} ·
           slots ${factOr(sv, 'total_slots', v => `<strong>${v}</strong>`)}</div>`}
      ${fileLine(sv, 'model', 'model_file', 'model_bytes')}
      ${fileLine(sv, 'draft', 'draft_file', 'draft_bytes')}
      ${sv.state === 'unknown' ? `<div class="reason">state unknown: ${esc(sv.state_reason)}</div>` : ''}
      ${sv.health !== 'answering' && sv.health_reason && sv.health_reason !== propsWhy ? `<div class="reason">${esc(sv.health_reason)}</div>` : ''}`;
  }
  const gpu = fmtGiB(sv.gpu_bytes), ram = fmtGiB(sv.rss_bytes);

  return `
    <div class="server-card">
      <div class="server-card-top">
        <div class="server-color-bar" style="background:${color}"></div>
        <div class="server-main">
          <div class="server-name-row">
            <span class="status-dot ${h.cls}"></span>
            <span class="server-name">${esc(sv.name)}</span>
            ${sv.unit ? `<span class="badge badge-quant">${esc(sv.unit)}</span>` : ''}
          </div>
          <div class="server-meta">
            ${sv.port ? `<span>:${sv.port}</span>` : ''}
            <span>${STATE_LABEL[sv.state] || esc(sv.state)}</span>
            <span style="color:${h.color}">${h.text}</span>
          </div>
          <div class="server-facts">${facts}</div>
          <div class="agent-chips">${chips}</div>
        </div>
        <div class="server-right">
          ${gpu != null ? `
            <div class="server-vram" style="color:${color}">${gpu}</div>
            <div class="server-vram-sub">GPU memory (GTT + VRAM)</div>
            <div class="server-vram-sub">RAM ${ram ?? '—'}</div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderServers(srv) {
  const grid = document.getElementById('server-grid');
  const servers = srv.servers || [];
  document.getElementById('server-src').innerHTML =
    srcLine('State and memory', srv.sources?.gpu_mem) + '<br>' +
    srcLine('Health, context, slots and files', srv.sources?.llama_props);
  if (!servers.length) {
    grid.innerHTML = `<div style="color:var(--text3);font-size:13px;padding:1rem">No servers in the catalog.</div>`;
    return;
  }
  grid.innerHTML = ['running', 'unknown', 'not_running'].map(state => {
    const group = servers.filter(s => s.state === state);
    if (!group.length) return '';
    return `<div class="group-label">${STATE_LABEL[state]}</div>` + group.map(serverCard).join('');
  }).join('');
}

function renderOthers(srv) {
  const grid = document.getElementById('other-grid');
  const others = srv.other_processes || [];
  if (!others.length) {
    const fresh = srv.sources?.gpu_mem?.state === 'fresh';
    grid.innerHTML = `<div class="reason" style="padding:0.5rem">${fresh ? 'none' : esc(srv.sources?.gpu_mem?.reason || 'unknown')}</div>`;
    return;
  }
  grid.innerHTML = others.map(o => {
    const color = colorFor(o.unit);
    const file = o.unit.startsWith('llama-')
      ? `<div class="server-facts">${fileLine(o, 'model', 'model_file', 'model_bytes')}${fileLine(o, 'draft', 'draft_file', 'draft_bytes')}</div>` : '';
    return `
      <div class="server-card">
        <div class="server-card-top">
          <div class="server-color-bar" style="background:${color}"></div>
          <div class="server-main">
            <div class="server-name-row"><span class="server-name">${esc(o.unit)}</span></div>
            <div class="server-meta"><span>${esc(o.kind)}</span>${o.port ? `<span>:${o.port}</span>` : ''}</div>
            ${file}
          </div>
          <div class="server-right">
            <div class="server-vram" style="color:${color}">${fmtGiB(o.gpu_bytes) ?? '—'}</div>
            <div class="server-vram-sub">GPU memory (GTT + VRAM)</div>
            <div class="server-vram-sub">RAM ${fmtGiB(o.rss_bytes) ?? '—'}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Activity ──────────────────────────────────────────────────────────────────

function renderActivity(act) {
  const el = document.getElementById('activity');
  if (act.error) {
    el.innerHTML = `<span class="reason">${esc(act.error)}</span>`;
    document.getElementById('activity-src').textContent = '';
    return;
  }
  const row = (m, cls = '') => `<tr class="${cls}">
      <td>${esc(m.model)}</td>
      <td class="num">${fmtInt(m.requests)}</td>
      <td class="num">${fmtInt(m.prompt_tokens)}</td>
      <td class="num">${fmtInt(m.completion_tokens)}</td>
      <td title="${esc(m.last_used || '')}">${m.last_used ? esc(fmtLocal(m.last_used)) : 'never'}</td>
    </tr>`;
  const apart = act.not_in_catalog || [];
  el.innerHTML = `<table class="act-table">
      <tr><th>model</th><th class="num">calls</th><th class="num">prompt tokens</th>
          <th class="num">completion tokens</th><th>last used (any time)</th></tr>
      ${(act.models || []).map(m => row(m)).join('')}
      ${apart.length ? `<tr><th colspan="5">not in the catalog</th></tr>` + apart.map(m => row(m, 'apart')).join('') : ''}
    </table>`;
  document.getElementById('activity-src').innerHTML =
    `Source: ${esc(act.source)}. Window ${esc(fmtLocal(act.since))} to ${esc(fmtLocal(act.now))}, read at this request. Times are this browser's local time.`;
}

// ── Main load ─────────────────────────────────────────────────────────────────

async function getJSON(url) {
  try {
    const r = await fetch(url);
    const body = await r.json().catch(() => ({}));
    if (!r.ok) return { error: body.error || body.detail || `${url}: HTTP ${r.status}` };
    return body;
  } catch (e) {
    return { error: `${url}: ${e.message}` };
  }
}

async function loadAll() {
  const [sys, srv, act] = await Promise.all([getJSON('api/system'), getJSON('api/servers'), getJSON('api/activity')]);

  if (sys.mem_total) { renderMemBar(sys, srv); renderDisk(sys); }
  else document.getElementById('mem-src').textContent = sys.error || 'api/system gave no memory figures';
  if (srv.error) document.getElementById('server-grid').innerHTML = `<div class="reason">${esc(srv.error)}</div>`;
  else { renderServers(srv); renderOthers(srv); }
  renderActivity(act);

  document.getElementById('last-updated').textContent =
    'updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
