<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronk — Services</title>
<link rel="stylesheet" href="/static/kronk.css">
<style>
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .service-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .service-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .service-icon {
    font-size: 20px;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }

  .service-info { flex: 1; min-width: 0; }

  .service-name {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .service-desc {
    font-size: 12px;
    color: var(--text3);
    margin-top: 2px;
  }

  .port-badge {
    font-size: 10px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }

  .internal-badge {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 7px;
    font-style: italic;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text3);
  }
  .status-dot.up   { background: var(--green); }
  .status-dot.down { background: var(--red); }

  .model-badge {
    font-size: 10px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-style: normal;
  }

  .open-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: 12px;
    padding: 5px 14px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .open-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>Services</h1>
  <span class="subtitle">kronk</span>
</header>

<main>

  <div>
    <div class="section-label">Pages</div>
    <div class="service-grid" id="page-grid"></div>
  </div>

  <div>
    <div class="section-label">Companion apps</div>
    <div class="service-grid" id="app-grid"></div>
  </div>

  <div>
    <div class="section-label">Agents</div>
    <div class="service-grid" id="agent-grid">
      <!-- populated by /api/agents + /api/servers -->
    </div>
  </div>

  <div>
    <div class="section-label">Model servers</div>
    <div class="service-grid" id="model-grid">
      <!-- populated by /api/servers (litellm catalog + live health) -->
    </div>
  </div>

  <div>
    <div class="section-label">Internal services</div>
    <div class="service-grid" id="internal-grid"></div>
  </div>

</main>

<script src="/static/js/kronk.js"></script>
<script>
  // Everything below is served through nginx on :80 unless a port is shown.
  // A probe of null means there is no HTTP health check (Wyoming is raw TCP),
  // so the card shows no dot rather than a guess.
  const PAGES = [
    { icon: '💬', name: 'Chat',             href: '/',              probe: '/probe/orchestrator', desc: 'Main chat interface' },
    { icon: '🛒', name: 'Shopping List',    href: '/shopping_list', probe: '/probe/tools',        desc: 'Mobile-friendly shopping list' },
    { icon: '❤️', name: 'Health',           href: '/health',        probe: '/probe/health',       desc: 'Garmin/Withings — sleep, HRV, weight, activities' },
    { icon: '💰', name: 'Finances',         href: '/finances',      probe: '/probe/finance',      desc: 'Financial documents and positions' },
    { icon: '☀️', name: 'Solar',            href: '/solar',         probe: '/probe/tools',        desc: 'Production, daily energy, per-panel health' },
    { icon: '🏖️', name: 'Retirement Calc',  href: '/retire/',       probe: '/probe/retire',       desc: 'FERS + Monte Carlo retirement calculator' },
    { icon: '🤝', name: 'Agents',           href: '/agents',        probe: null,                  desc: 'Agents, tools, and assigned models' },
    { icon: '📊', name: 'Resources',        href: '/resources',     probe: null,                  desc: 'Model memory (measured), system RAM, GTT' },
    { icon: '⏱️', name: 'Performance',      href: '/performance',   probe: null,                  desc: 'Per-turn latency and token metrics' },
  ];

  // Separate apps on their own ports; links follow whatever host this page was loaded from.
  const APPS = [
    { icon: '🏡', name: 'Home Assistant',   port: 8123, probe: '/probe/ha',       desc: 'Voice pipeline broker, satellites, automations' },
    { icon: '🎵', name: 'Music Assistant',  port: 8095, probe: '/probe/ma',       desc: 'Players, YouTube Music, Pandora, NAS library' },
    { icon: '🔭', name: 'Langfuse',         port: 3000, probe: '/probe/langfuse', desc: 'Telemetry traces (v1 prototype)' },
  ];

  const INTERNAL = [
    { icon: '🔀', name: 'LiteLLM',          port: 8002,  where: 'host net',  probe: '/probe/llm',     desc: 'OpenAI-compatible proxy in front of the llama.cpp servers' },
    { icon: '🛠️', name: 'Tool Service',     port: 8003,  where: 'internal',  probe: '/probe/tools',   desc: 'Weather, search, music, solar, news, shopping list, mirror ops' },
    { icon: '❤️', name: 'Health Service',   port: 8004,  where: 'internal',  probe: '/probe/health',  desc: 'Health imports, SQLite, vector store' },
    { icon: '💰', name: 'Finance Service',  port: 8005,  where: 'internal',  probe: '/probe/finance', desc: 'Financial-document search and positions store' },
    { icon: '🔍', name: 'SearXNG',          port: 8080,  where: 'internal',  probe: '/probe/searxng', desc: 'Self-hosted meta-search — queries never leave the house' },
    { icon: '🎙️', name: 'Whisper STT',      port: 10300, where: 'host unit', probe: null,             desc: 'Wyoming faster-whisper on the GPU' },
    { icon: '🔊', name: 'Piper TTS',        port: 10200, where: 'container', probe: null,             desc: 'Wyoming Piper text-to-speech' },
  ];

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function card({ icon, name, badge, badgeClass = 'port-badge', dotId, desc, href, tag }) {
    return `
      <div class="service-card">
        <div class="service-icon">${icon}</div>
        <div class="service-info">
          <div class="service-name">
            ${esc(name)}
            ${badge ? `<span class="${badgeClass}">${esc(badge)}</span>` : ''}
            ${dotId ? `<div class="status-dot" id="${dotId}"></div>` : ''}
          </div>
          <div class="service-desc">${esc(desc)}</div>
        </div>
        ${href ? `<a class="open-btn" href="${href}" target="_blank">Open</a>`
               : tag ? `<span class="internal-badge">${esc(tag)}</span>` : ''}
      </div>`;
  }

  const checks = [];
  function render(gridId, items, toCard) {
    document.getElementById(gridId).innerHTML = items.map((it, i) => {
      const dotId = it.probe ? `s-${gridId}-${i}` : null;
      if (dotId) checks.push({ id: dotId, url: it.probe });
      return card({ ...toCard(it), dotId });
    }).join('');
  }

  render('page-grid', PAGES, p => ({ ...p, href: p.href }));
  render('app-grid', APPS, a => ({
    ...a, badge: `:${a.port}`,
    href: `${location.protocol}//${location.hostname}:${a.port}/`,
  }));
  render('internal-grid', INTERNAL, s => ({ ...s, badge: `:${s.port}`, tag: s.where }));

  function setDot(id, ok) {
    const dot = document.getElementById(id);
    if (!dot) return;
    dot.classList.toggle('up', ok);
    dot.classList.toggle('down', !ok);
  }

  // Agents and model servers: health comes from /api/servers, which asks
  // LiteLLM about each llama.cpp backend. An agent is up only when its
  // model's server is healthy.
  async function loadDynamic() {
    const agentGrid = document.getElementById('agent-grid');
    const modelGrid = document.getElementById('model-grid');
    let servers = [];
    try {
      servers = (await (await fetch('/api/servers')).json()).servers;
      const health = Object.fromEntries(servers.map(s => [s.name, !!s.healthy]));
      // Assigned and healthy first; unassigned catalog entries last.
      const ordered = [...servers].sort((a, b) =>
        (b.agents.length > 0) - (a.agents.length > 0) || (b.healthy - a.healthy));
      modelGrid.innerHTML = ordered.map((s, i) => card({
        icon: '🧠', name: s.name, badge: `:${s.port}`, dotId: `s-model-${i}`,
        desc: [s.params, s.quant, s.ctx_k && `${s.ctx_k}k ctx`,
               s.measured_gb != null && `${s.measured_gb} GB measured`,
               s.agents.length ? `→ ${s.agents.join(', ')}` : 'unassigned']
              .filter(Boolean).join(' · '),
        tag: s.healthy ? 'running' : 'not running',
      })).join('');
      ordered.forEach((s, i) => setDot(`s-model-${i}`, !!s.healthy));

      const { agents } = await (await fetch('/api/agents')).json();
      agentGrid.innerHTML = agents.map((a, i) => card({
        icon: a.icon, name: a.name, badge: a.model, badgeClass: 'model-badge',
        dotId: `s-agent-${i}`, desc: a.desc,
      })).join('');
      agents.forEach((a, i) => setDot(`s-agent-${i}`, !!health[a.model]));
    } catch {
      const msg = '<div style="color:var(--text3);font-size:12px;padding:0.5rem">could not load /api/servers or /api/agents</div>';
      if (!servers.length) modelGrid.innerHTML = msg;
      agentGrid.innerHTML = msg;
    }
  }

  async function refresh() {
    await Promise.allSettled([KronkUI.checkDots(checks), loadDynamic()]);
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
