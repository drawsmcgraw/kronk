<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronk — Services</title>
<link rel="stylesheet" href="static/kronk.css">
<style>
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .service-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .service-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .service-icon {
    font-size: 20px;
    width: 32px;
    text-align: center;
    flex-shrink: 0;
  }

  .service-info { flex: 1; min-width: 0; }

  .service-name {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .service-desc {
    font-size: 12px;
    color: var(--text3);
    margin-top: 2px;
  }

  .port-badge {
    font-size: 10px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }

  .internal-badge {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 7px;
    font-style: italic;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text3);
  }
  .status-dot.up   { background: var(--green); }
  .status-dot.down { background: var(--red); }
  .status-dot.unknown { background: var(--text3); }

  .model-badge {
    font-size: 10px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-style: normal;
  }

  .open-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text2);
    font-size: 12px;
    padding: 5px 14px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .open-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>Services</h1>
  <span class="subtitle">kronk</span>
</header>

<main>

  <div>
    <div class="section-label">Pages</div>
    <div class="service-grid" id="page-grid"></div>
  </div>

  <div>
    <div class="section-label">Companion apps</div>
    <div class="service-grid" id="app-grid"></div>
  </div>

  <div>
    <div class="section-label">Agents</div>
    <div class="service-grid" id="agent-grid">
      <!-- populated by api/agents + api/servers -->
    </div>
  </div>

  <div>
    <div class="section-label">Model servers</div>
    <div class="service-grid" id="model-grid">
      <!-- populated by api/servers (catalog + the host exporters' files) -->
    </div>
  </div>

  <div>
    <div class="section-label">Internal services</div>
    <div class="service-grid" id="internal-grid"></div>
  </div>

  <div>
    <div class="section-label">Upgrades</div>
    <div class="service-grid" id="upgrade-grid">
      <!-- populated by /api/upgrades (the upgrade cadence's status file) -->
    </div>
  </div>

  <div>
    <div class="section-label">Backups</div>
    <div class="service-grid" id="backup-grid">
      <!-- populated by /api/backups (the backup jobs' status file) -->
    </div>
  </div>

  <div>
    <div class="section-label">Config (config/ prompts and tuning)</div>
    <div class="service-grid" id="config-grid">
      <!-- populated by api/config (orchestrator + tool_service loaders) -->
    </div>
  </div>

</main>

<script src="static/js/kronk.js"></script>
<script>
  // Everything below is served through nginx on :80 unless a port is shown.
  // A probe of null means there is no HTTP health check (Wyoming is raw TCP),
  // so the card shows no dot rather than a guess.
  const PAGES = [
    { icon: '💬', name: 'Chat',             href: '/',              probe: '/probe/orchestrator', desc: 'Main chat interface' },
    { icon: '🛒', name: 'Shopping List',    href: '/shopping_list', probe: '/probe/tools',        desc: 'Mobile-friendly shopping list' },
    { icon: '☀️', name: 'Solar',            href: '/solar',         probe: '/probe/tools',        desc: 'Production, daily energy, per-panel health' },
    { icon: '🤝', name: 'Agents',           href: '/agents',        probe: null,                  desc: 'Agents, tools, and assigned models' },
    { icon: '📊', name: 'Resources',        href: '/resources',     probe: null,                  desc: 'Model servers as measured, system RAM, GTT, disk, calls in the last 24 hours' },
    { icon: '⏱️', name: 'Performance',      href: '/performance',   probe: null,                  desc: 'Per-turn latency and token metrics' },
    { icon: '🎛️', name: 'Settings',         href: '/settings',      probe: null,                  desc: 'Every prompt and tuning value in effect; editing behind a passphrase' },
  ];

  // Separate apps on their own ports; links follow whatever host this page was loaded from.
  const APPS = [
    { icon: '🏡', name: 'Home Assistant',   port: 8123, probe: '/probe/ha',       desc: 'Voice pipeline broker, satellites, automations' },
    { icon: '🎵', name: 'Music Assistant',  port: 8095, probe: '/probe/ma',       desc: 'Players, YouTube Music, Pandora, NAS library' },
    { icon: '📈', name: 'Grafana',          port: 3000, probe: '/probe/grafana',  desc: 'Telemetry v2 — traces and dashboards (Tempo + TraceQL)' },
  ];

  const INTERNAL = [
    { icon: '🔀', name: 'LiteLLM',          port: 8002,  where: 'host net',  probe: '/probe/llm',     desc: 'OpenAI-compatible proxy in front of the llama.cpp servers' },
    { icon: '🛠️', name: 'Tool Service',     port: 8003,  where: 'internal',  probe: '/probe/tools',   desc: 'Weather, search, music, solar, news, shopping list, mirror ops' },
    { icon: '🔍', name: 'SearXNG',          port: 8080,  where: 'internal',  probe: '/probe/searxng', desc: 'Self-hosted meta-search — queries never leave the house' },
    { icon: '🎙️', name: 'Whisper STT',      port: 10300, where: 'host unit', probe: null,             desc: 'Wyoming faster-whisper on the GPU' },
    { icon: '🔊', name: 'Piper TTS',        port: 10200, where: 'container', probe: null,             desc: 'Wyoming Piper text-to-speech' },
    { icon: '🧵', name: 'Tempo',            port: 3200,  where: 'telemetry', probe: '/probe/tempo',   desc: 'Grafana Tempo trace store (OTLP in, 90-day retention)' },
    { icon: '🎧', name: 'Voice tracer',     port: 8010,  where: 'internal',  probe: '/probe/voice_tracer', desc: 'HA voice runs + blueprint runs → traces' },
  ];

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function card({ icon, name, badge, badgeClass = 'port-badge', dotId, desc, href, tag }) {
    return `
      <div class="service-card">
        <div class="service-icon">${icon}</div>
        <div class="service-info">
          <div class="service-name">
            ${esc(name)}
            ${badge ? `<span class="${badgeClass}">${esc(badge)}</span>` : ''}
            ${dotId ? `<div class="status-dot" id="${dotId}"></div>` : ''}
          </div>
          <div class="service-desc">${esc(desc)}</div>
        </div>
        ${href ? `<a class="open-btn" href="${href}" target="_blank">Open</a>`
               : tag ? `<span class="internal-badge">${esc(tag)}</span>` : ''}
      </div>`;
  }

  const checks = [];
  function render(gridId, items, toCard) {
    document.getElementById(gridId).innerHTML = items.map((it, i) => {
      const dotId = it.probe ? `s-${gridId}-${i}` : null;
      if (dotId) checks.push({ id: dotId, url: it.probe });
      return card({ ...toCard(it), dotId });
    }).join('');
  }

  render('page-grid', PAGES, p => ({ ...p, href: p.href }));
  render('app-grid', APPS, a => ({
    ...a, badge: `:${a.port}`,
    href: `${location.protocol}//${location.hostname}:${a.port}/`,
  }));
  render('internal-grid', INTERNAL, s => ({ ...s, badge: `:${s.port}`, tag: s.where }));

  function setDot(id, ok) {
    const dot = document.getElementById(id);
    if (!dot) return;
    dot.classList.toggle('up', ok);
    dot.classList.toggle('down', !ok);
  }

  // A dot in one of three states (up, down, unknown), with its reason as
  // the tooltip.
  function setDotState(id, cls, title) {
    const dot = document.getElementById(id);
    if (!dot) return;
    for (const c of ['up', 'down', 'unknown']) dot.classList.toggle(c, c === cls);
    if (title) dot.title = title; else dot.removeAttribute('title');
  }

  // Agents and model servers, from api/servers (M25): state from the host
  // memory exporter's file, health from the props exporter's (the server
  // answered GET /props when the file was written). Relative URLs, so
  // /dev/services shows dev's servers.
  //
  // Three states, never two (M25 fix round 1, S3): answering is up, not
  // answering is down, and unknown (llama_props.json stale or missing) is
  // a neutral dot with the reason, not down. An agent's dot is its model
  // server's. The tables are JSON literals: tests/test_m25_fix1_pages.py
  // reads them (the suite has no JavaScript runtime).
  const GIB = 2 ** 30;
  const gib = b => b == null ? null : ((b / GIB) < 1 ? (b / GIB).toFixed(2) : (b / GIB).toFixed(1)) + ' GiB';
  const HEALTH_DOT = {"answering": "up", "not_answering": "down", "unknown": "unknown"};
  const SERVER_TAG = {
    "state_unknown": "state unknown",
    "not_running": "not running",
    "health_unknown": "health unknown",
    "answering": "running",
    "not_answering": "running, not answering"
  };

  // Pure: a model server row's dot, tag and reasons from its payload row.
  function serverView(s) {
    const key = s.state === 'unknown' ? 'state_unknown'
              : s.state === 'not_running' ? 'not_running'
              : s.health === 'unknown' ? 'health_unknown'
              : s.health === 'answering' ? 'answering' : 'not_answering';
    const reasons = [];
    if (s.state !== 'running' && s.state_reason) reasons.push(s.state_reason);
    // Not running implies not answering; that reason would say it twice.
    if (s.state !== 'not_running' && s.health !== 'answering' && s.health_reason
        && !reasons.includes(s.health_reason)) reasons.push(s.health_reason);
    return { dot: HEALTH_DOT[s.health] || 'unknown', tag: SERVER_TAG[key], reasons };
  }

  // Pure: an agent's dot follows its model server's health; a model with
  // no server row is unknown.
  function agentView(server, model) {
    if (!server) return { dot: 'unknown', title: `model ${model} is not in api/servers` };
    const v = serverView(server);
    return { dot: v.dot, title: `${server.name}: ${v.tag}` + (v.reasons.length ? ` (${v.reasons.join('; ')})` : '') };
  }
  async function loadDynamic() {
    const agentGrid = document.getElementById('agent-grid');
    const modelGrid = document.getElementById('model-grid');
    let servers = [];
    try {
      servers = (await (await fetch('api/servers')).json()).servers;
      const byName = Object.fromEntries(servers.map(s => [s.name, s]));
      // Assigned and running first; unassigned catalog entries last.
      const rank = s => (s.state === 'running' ? 0 : s.state === 'unknown' ? 1 : 2);
      const ordered = [...servers].sort((a, b) =>
        (b.agents.length > 0) - (a.agents.length > 0) || rank(a) - rank(b));
      const views = ordered.map(serverView);
      modelGrid.innerHTML = ordered.map((s, i) => card({
        icon: '🧠', name: s.name, badge: s.port ? `:${s.port}` : '', dotId: `s-model-${i}`,
        desc: [s.model_file,
               s.n_ctx != null && `${s.n_ctx} ctx`,
               s.gpu_bytes != null && `${gib(s.gpu_bytes)} GPU memory`,
               ...views[i].reasons,
               s.agents.length ? `→ ${s.agents.join(', ')}` : 'unassigned']
              .filter(Boolean).join(' · '),
        tag: views[i].tag,
      })).join('');
      ordered.forEach((s, i) => setDotState(`s-model-${i}`, views[i].dot, views[i].reasons.join('; ')));

      const { agents } = await (await fetch('api/agents')).json();
      agentGrid.innerHTML = agents.map((a, i) => card({
        icon: a.icon, name: a.name, badge: a.model, badgeClass: 'model-badge',
        dotId: `s-agent-${i}`, desc: a.desc,
      })).join('');
      agents.forEach((a, i) => {
        const v = agentView(byName[a.model], a.model);
        setDotState(`s-agent-${i}`, v.dot, v.title);
      });
    } catch {
      const msg = '<div style="color:var(--text3);font-size:12px;padding:0.5rem">could not load api/servers or api/agents</div>';
      if (!servers.length) modelGrid.innerHTML = msg;
      agentGrid.innerHTML = msg;
    }
  }

  // config/ status (sprint M21). Relative URL on purpose: under /dev/ the
  // page asks orchestrator-dev, not production.
  // card() escapes desc, so it is built as plain text.
  async function loadConfig() {
    const grid = document.getElementById('config-grid');
    try {
      const { services } = await (await fetch('api/config')).json();
      grid.innerHTML = services.map((s, i) => {
        const errs = (s.errors || []).map(e =>
          `${e.file || ''}${e.line ? ' line ' + e.line : ''}: ${e.message}`);
        // Warnings (fix round 1): loaded, but worth a look — a YAML file
        // with no keys, or a file under config/ that no service reads.
        const warns = (s.warnings || []).map(e =>
          `${e.file || ''}${e.line ? ' line ' + e.line : ''}: ${e.message}`);
        const when = s.at ? new Date(s.at * 1000).toLocaleString() : '';
        const desc = s.ok
          ? `${s.source} · ${Object.keys(s.files || {}).length} files · ${s.event || ''} ${when}`
            + (warns.length ? ` — WARNING: ${warns.join(' | ')}` : '')
          : `${(s.event || 'load').toUpperCase()} REJECTED ${when} — ${errs.join(' | ')} — in effect: ${s.kept || s.source}`;
        return card({ icon: '🗂️', name: s.service, badge: s.ok ? (warns.length ? 'warning' : 'ok') : 'error',
                      dotId: `s-config-${i}`, desc, tag: s.dir || '' });
      }).join('');
      services.forEach((s, i) => setDot(`s-config-${i}`, !!s.ok));
    } catch {
      grid.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:0.5rem">could not load api/config</div>';
    }
  }

  // Upgrade cadence (sprint M18). Absolute URL on purpose: there is one
  // status file per house (production's data/upgrades/status.json), and a
  // warning must show on /dev/services too. It stays until acknowledged on
  // the host (python3 scripts/upgrades.py ack); it does not depend on HA.
  async function loadUpgrades() {
    const grid = document.getElementById('upgrade-grid');
    try {
      const r = await fetch('/api/upgrades');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const u = await r.json();
      const warns = u.warnings || [];
      const last = u.last_run;
      const when = last && last.at ? new Date(last.at).toLocaleString() : '';
      let desc;
      if (warns.length) {
        desc = `WARNING: ${warns.join(' | ')}` + (u.ack ? ` — clear with: ${u.ack}` : '');
      } else if (last) {
        desc = `last ${last.kind} run ${when}: ${last.summary || last.result}`;
      } else {
        desc = u.note || 'no upgrade run yet';
      }
      if (u.major && u.major.report) desc += ` · major-upgrade report: ${u.major.report}`;
      if (u.pending_notices) desc += ` · ${u.pending_notices} notice(s) waiting for HA`;
      grid.innerHTML = card({ icon: '⬆️', name: 'Upgrade cadence',
                              badge: warns.length ? 'warning' : 'ok', dotId: 's-upgrade-0',
                              desc, tag: last ? last.result : 'monthly / quarterly' });
      setDot('s-upgrade-0', !warns.length);
    } catch (e) {
      grid.innerHTML = `<div style="color:var(--text3);font-size:12px;padding:0.5rem">could not load /api/upgrades (${esc(e.message)})</div>`;
    }
  }

  // Backups (sprint M16). Absolute URL for the same reason as the upgrade
  // card: one status file per house (production's data/backups/status.json).
  async function loadBackups() {
    const grid = document.getElementById('backup-grid');
    try {
      const r = await fetch('/api/backups');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const b = await r.json();
      const warns = b.warnings || [];
      const line = (j, word) => {
        const last = (b.jobs || {})[j] && b.jobs[j].last;
        if (!last) return `${word}: no run yet`;
        const when = last.at ? new Date(last.at).toLocaleString() : '';
        const size = last.size ? `, ${(last.size / 1e6).toFixed(1)} MB` : '';
        const moved = j === 'archive' && last.moved !== undefined ? `, moved ${last.moved}, ${last.remaining ?? '?'} local` : '';
        return `${word} ${when}: ${last.result}${size}${moved}`;
      };
      let desc = b.present ? `${line('config', 'config backup')} · ${line('archive', 'recordings archive')}`
                           : (b.note || 'no backup run yet');
      if (warns.length) desc = `WARNING: ${warns.join(' | ')} — ` + desc;
      grid.innerHTML = card({ icon: '💾', name: 'Backups', badge: warns.length ? 'warning' : 'ok',
                              dotId: 's-backup-0', desc, tag: 'monthly config / weekly recordings' });
      setDot('s-backup-0', !warns.length);
    } catch (e) {
      grid.innerHTML = `<div style="color:var(--text3);font-size:12px;padding:0.5rem">could not load /api/backups (${esc(e.message)})</div>`;
    }
  }

  async function refresh() {
    await Promise.allSettled([KronkUI.checkDots(checks), loadDynamic(), loadConfig(), loadUpgrades(), loadBackups()]);
  }

  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
